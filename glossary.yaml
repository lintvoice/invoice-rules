# The glossary of e-invoicing: each word in plain words, in English and French, with its official source and the
# rules that check it. The format: FORMAT.md, "Glossary". An id is the word's anchor on the site: it never changes.

groups:
  - key: formats
    name: {en: "Formats and standards", fr: "Formats et normes"}
    line:
      en: "What an e-invoice is, and the formats it is written in."
      fr: "Ce qu'est une facture électronique, et les formats dans lesquels elle s'écrit."
  - key: reforme
    name: {en: "The French reform and its actors", fr: "La réforme française et ses acteurs"}
    line:
      en: "Who sends, who receives, who checks."
      fr: "Qui transmet, qui reçoit, qui vérifie."
  - key: identifiants
    name: {en: "Identifiers and mentions", fr: "Identifiants et mentions"}
    line:
      en: "What the invoice must say about you and your client."
      fr: "Ce que la facture doit dire de vous et de votre client."
  - key: regles
    name: {en: "Rules and checks", fr: "Règles et contrôles"}
    line:
      en: "How an invoice is checked, and what the error codes mean."
      fr: "Comment une facture est vérifiée, et ce que veulent dire les codes d'erreur."
  - key: tva
    name: {en: "VAT", fr: "TVA"}
    line:
      en: "The VAT categories each line carries, and the special cases."
      fr: "Les catégories de TVA que porte chaque ligne, et les cas particuliers."
  - key: public
    name: {en: "Public sector", fr: "Secteur public"}
    line:
      en: "What it takes to invoice the State, local authorities and hospitals."
      fr: "Ce qu'il faut pour facturer l'État, les collectivités et les hôpitaux."
  - key: allemagne
    name: {en: "Germany", fr: "Allemagne"}
    line:
      en: "The words to know to invoice in Germany."
      fr: "Les mots à connaître pour facturer en Allemagne."

terms:
  - id: facture-electronique
    group: formats
    name: {en: "E-invoice", fr: "Facture électronique"}
    text:
      en: "An invoice issued, sent and received as structured data that software reads without retyping. A plain PDF or a scan is not one. In France it uses a format set by ministerial order and goes through an approved platform."
      fr: "Facture émise, transmise et reçue sous forme de données structurées, qu'un logiciel lit sans ressaisie. Un PDF simple ou une image n'en est pas une. En France, elle suit un format fixé par arrêté et passe par une plateforme agréée."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053576899
    source_name:
      en: "French tax code, art. 289 bis"
      fr: "Code général des impôts, art. 289 bis"
  - id: format-structure
    group: formats
    name: {en: "Structured format", fr: "Format structuré"}
    text:
      en: "A file where each piece of information (number, date, amount, VAT…) sits in a named field, XML for the French formats, so that software can read it directly."
      fr: "Fichier où chaque information (numéro, date, montant, TVA…) est rangée dans un champ nommé, en XML pour les formats français, pour qu'un logiciel la lise directement."
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014L0055
    source_name:
      en: "Directive 2014/55/EU, art. 2"
      fr: "Directive 2014/55/UE, art. 2"
  - id: factur-x
    group: formats
    name: {en: "Factur-X", fr: "Factur-X"}
    text:
      en: "A Franco-German hybrid format: a PDF a person reads, carrying an XML file (CII) that software reads. French law accepts it as the \"mixed format\" without naming it. Current version: 1.09.2, of 4 August 2026."
      fr: "Format franco-allemand « mixte » : un PDF lisible par une personne, qui contient un fichier XML (CII) lu par les logiciels. La loi l'accepte comme « format mixte », sans le nommer. Version actuelle : 1.09.2, du 4 août 2026."
    source: https://fnfe-mpe.org/factur-x/
    source_name: {en: "FNFE-MPE", fr: "FNFE-MPE"}
  - id: profil-factur-x
    group: formats
    name: {en: "Factur-X profile", fr: "Profil Factur-X"}
    text:
      en: "How much data the XML of a Factur-X carries, from the lightest to the fullest: MINIMUM, BASIC WL, BASIC, EN 16931 and EXTENDED. In France, the law recognises as an e-invoice the EN 16931 profile and EXTENDED's French subset, called EXTENDED-CTC-FR."
      fr: "La quantité de données que porte le XML d'un Factur-X, de la plus légère à la plus complète : MINIMUM, BASIC WL, BASIC, EN 16931 et EXTENDED. En France, la loi reconnaît comme facture électronique le profil EN 16931 et le sous-ensemble français d'EXTENDED, appelé EXTENDED-CTC-FR."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054606107
    source_name:
      en: "French tax code, annex IV, art. 41 septies C"
      fr: "Annexe IV du CGI, art. 41 septies C"
  - id: zugferd
    group: formats
    name: {en: "ZUGFeRD", fr: "ZUGFeRD"}
    text:
      en: "Factur-X's German name, technically identical, published by FeRD with FNFE-MPE. Version 2.5.2, effective since 1 September 2026."
      fr: "Le nom allemand de Factur-X, techniquement identique, publié par le FeRD avec le FNFE-MPE. Version 2.5.2, applicable depuis le 1er septembre 2026."
    source: https://www.ferd-net.de/en/downloads/publications/details/zugferd-252-english
    source_name: {en: "FeRD", fr: "FeRD"}
  - id: ubl
    group: formats
    name: {en: "UBL", fr: "UBL"}
    text:
      en: "An XML language for business documents (invoice, credit note, order…) published by OASIS. It is one of the two syntaxes of the European standard (UBL 2.1), used notably on the Peppol network."
      fr: "Langage XML de documents commerciaux (facture, avoir, commande…) publié par l'organisme OASIS. C'est l'une des deux syntaxes de la norme européenne (UBL 2.1), utilisée notamment sur le réseau Peppol."
    source: https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/Compliance+with+eInvoicing+standard
    source_name:
      en: "European Commission"
      fr: "Commission européenne"
  - id: cii
    group: formats
    name: {en: "CII", fr: "CII"}
    text:
      en: "An XML invoice format published by the United Nations (UN/CEFACT). It is the other syntax of the European standard, and the XML inside a Factur-X."
      fr: "Format XML de facture publié par les Nations unies (UN/CEFACT). C'est l'autre syntaxe de la norme européenne, et le XML que contient un Factur-X."
    source: https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/Navigating%2Bthe%2BeInvoicing%2Bstandard%2Bdocumentation
    source_name:
      en: "European Commission"
      fr: "Commission européenne"
  - id: en-16931
    group: formats
    name: {en: "EN 16931, the European standard", fr: "EN 16931, la norme européenne"}
    text:
      en: "The European standard that lists the information an e-invoice carries (the business terms) and the rules that link them, whatever the syntax, UBL or CII. A new edition, EN 16931-1:2026, came out in May 2026; the 2017 edition stays accepted during the transition."
      fr: "La norme européenne qui liste les informations d'une facture électronique (les termes métier) et les règles qui les relient, quelle que soit la syntaxe, UBL ou CII. Une nouvelle édition, EN 16931-1:2026, est parue en mai 2026 ; l'édition 2017 reste admise pendant la transition."
    source: https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/Navigating%2Bthe%2BeInvoicing%2Bstandard%2Bdocumentation
    source_name:
      en: "European Commission"
      fr: "Commission européenne"
    rules: [BR-CO-10, BR-CO-15]
  - id: pdf-a-3
    group: formats
    name: {en: "PDF/A-3", fr: "PDF/A-3"}
    text:
      en: "A PDF variant built for long-term archiving, which lets files be attached. Factur-X uses it to carry its XML, and French law requires it for the readable part of the mixed format."
      fr: "Une variante du PDF conçue pour l'archivage de longue durée, qui permet d'y joindre des fichiers. Factur-X s'en sert pour transporter son XML, et la loi l'exige pour la partie lisible du format mixte."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054606107
    source_name:
      en: "French tax code, annex IV, art. 41 septies C"
      fr: "Annexe IV du CGI, art. 41 septies C"
  - id: peppol
    group: formats
    name: {en: "Peppol", fr: "Peppol"}
    text:
      en: "An international network for exchanging business documents (invoices, orders) between authorised providers, called \"access points\", under common rules set by the OpenPeppol association. In France the DGFiP has been the Peppol Authority since 8 July 2025, and a business reaches Peppol through its provider."
      fr: "Réseau international d'échange de documents commerciaux (factures, commandes) entre prestataires habilités, appelés « points d'accès », selon des règles communes fixées par l'association OpenPeppol. En France, la DGFiP en est l'autorité depuis le 8 juillet 2025, et une entreprise y accède par son prestataire."
    source: https://peppol.org/learn-more/country-profiles/france/
    source_name: {en: "OpenPeppol", fr: "OpenPeppol"}
  - id: calendrier
    group: reforme
    name: {en: "The reform's calendar", fr: "Calendrier de la réforme"}
    text:
      en: "Since 1 September 2026, every VAT-registered business established in France must be able to receive e-invoices. Large and mid-sized companies must also issue them since that date, small businesses and micro-businesses from 1 September 2027. E-reporting follows the same calendar."
      fr: "Depuis le 1er septembre 2026, toutes les entreprises établies en France et assujetties à la TVA doivent pouvoir recevoir des factures électroniques. Les grandes entreprises et les ETI doivent aussi en émettre depuis cette date, les PME et les micro-entreprises à partir du 1er septembre 2027. L'e-reporting suit le même calendrier."
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F39785
    source_name: {en: "service-public.fr", fr: "service-public.fr"}
  - id: plateforme-agreee
    group: reforme
    name: {en: "Approved platform", fr: "Plateforme agréée (PA)"}
    text:
      en: "A private provider registered by the French tax administration, formerly called PDP. A business goes through one to issue, send and receive its e-invoices, and it passes the required data to the administration. The list is published on impots.gouv.fr. The official English name is not verified."
      fr: "Prestataire privé immatriculé par l'administration fiscale, qu'on appelait PDP. L'entreprise passe par lui pour émettre, transmettre et recevoir ses factures électroniques, et il transmet les données requises à l'administration. La liste est publiée sur impots.gouv.fr."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053576899
    source_name:
      en: "French tax code, art. 289 bis"
      fr: "Code général des impôts, art. 289 bis"
  - id: ppf
    group: reforme
    name: {en: "Public invoicing portal", fr: "Portail public de facturation (PPF)"}
    text:
      en: "A public service first planned to exchange invoices too. That is no longer the case: all invoices go through approved platforms, and the texts amended in 2026 no longer name the PPF. The State keeps the central directory and receives the data."
      fr: "Service public prévu à l'origine pour échanger aussi des factures. Ce n'est plus le cas : toutes les factures passent par des plateformes agréées, et les textes modifiés en 2026 ne nomment plus le PPF. L'État tient l'annuaire central et reçoit les données."
    source: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000054499487
    source_name:
      en: "Decree 2026-677"
      fr: "Décret n° 2026-677"
  - id: annuaire
    group: reforme
    name: {en: "Directory", fr: "Annuaire"}
    text:
      en: "A register kept by the State that shows, for each business, its approved platform and the electronic address to send its invoices to. Platforms keep it up to date, so the sender does not need to know the buyer's platform."
      fr: "Registre tenu par l'État qui indique, pour chaque entreprise, sa plateforme agréée et l'adresse électronique où lui envoyer ses factures. Les plateformes le tiennent à jour, donc l'émetteur n'a pas besoin de connaître la plateforme de son client."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053576899
    source_name:
      en: "French tax code, art. 289 bis"
      fr: "Code général des impôts, art. 289 bis"
    rules: [BR-FR-12, BR-FR-13, BR-FR-21]
  - id: e-reporting
    group: reforme
    name: {en: "E-reporting", fr: "E-reporting"}
    text:
      en: "Sending the tax administration, through the approved platform, data on sales that are not e-invoiced (sales to consumers, transactions with other countries), and payment data for some services."
      fr: "L'envoi à l'administration fiscale, par la plateforme agréée, des données des ventes qui ne passent pas par une facture électronique (ventes aux particuliers, opérations avec l'étranger), et des données de paiement de certaines prestations de services."
    source: https://bofip.impots.gouv.fr/bofip/13901-PGP.html
    source_name: {en: "BOFiP", fr: "BOFiP"}
  - id: statuts
    group: reforme
    name: {en: "Lifecycle statuses", fr: "Statuts du cycle de vie"}
    text:
      en: "The steps of an invoice that platforms exchange and report to the administration. The law sets four: deposit (the issuer's platform accepts the invoice), rejection (a platform blocks it), refusal (the buyer disputes it) and collection (the seller has been paid, for operations where VAT is due on payment)."
      fr: "Les étapes d'une facture que les plateformes s'échangent et transmettent à l'administration. La loi en prévoit quatre : le dépôt (la plateforme de l'émetteur accepte la facture), le rejet (une plateforme la bloque), le refus (le client la conteste) et l'encaissement (le vendeur a été payé, pour les opérations dont la TVA est due au paiement)."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054606169
    source_name:
      en: "French tax code, annex IV, art. 41 septies G"
      fr: "Annexe IV du CGI, art. 41 septies G"
  - id: siren
    group: identifiants
    name: {en: "SIREN number", fr: "SIREN"}
    text:
      en: "The 9-digit number that identifies the business itself, given at registration. Under the reform, the buyer's SIREN must also appear on the invoice."
      fr: "Le numéro à 9 chiffres qui identifie l'entreprise elle-même, attribué à son immatriculation. Avec la réforme, le SIREN du client doit aussi figurer sur la facture."
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F31190
    source_name: {en: "service-public.fr", fr: "service-public.fr"}
    rules: [BR-FR-10, BR-FR-11, BR-FR-32, BR-FR-09]
  - id: siret
    group: identifiants
    name: {en: "SIRET number", fr: "SIRET"}
    text:
      en: "The 14-digit number of each establishment (place of business): the 9 digits of the SIREN, followed by 5 digits for the establishment."
      fr: "Le numéro à 14 chiffres de chaque établissement (lieu d'activité) : les 9 chiffres du SIREN, suivis de 5 chiffres propres à l'établissement."
    source: https://www.insee.fr/fr/metadonnees/definition/c1841
    source_name: {en: "Insee", fr: "Insee"}
    rules: [BR-FR-09]
  - id: tva-intracommunautaire
    group: identifiants
    name: {en: "Intra-Community VAT number", fr: "Numéro de TVA intracommunautaire"}
    text:
      en: "The business's VAT number, recognised across the European Union. In France it is FR, then 2 digits, then the SIREN. It can be checked on the EU's VIES service."
      fr: "Le numéro de TVA de l'entreprise, reconnu dans toute l'Union européenne. En France, il s'écrit FR, puis 2 chiffres, puis le SIREN. Il se vérifie sur le service européen VIES."
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F31190
    source_name: {en: "service-public.fr", fr: "service-public.fr"}
    rules: [BR-CO-09, BR-S-02]
  - id: mentions-obligatoires
    group: identifiants
    name: {en: "Mandatory invoice details", fr: "Mentions obligatoires"}
    text:
      en: "The information the law requires on every invoice: the parties, a unique number, the date, the details of the goods or services, the VAT rates and amounts, etc. The list is in article 242 nonies A of annex II of the French tax code."
      fr: "Les informations que la loi exige sur toute facture : l'identité des parties, un numéro unique, la date, le détail des biens ou services, les taux et montants de TVA, etc. La liste est à l'article 242 nonies A de l'annexe II du Code général des impôts."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000050811276
    source_name:
      en: "French tax code, annex II, art. 242 nonies A"
      fr: "Annexe II du CGI, art. 242 nonies A"
    rules: [BR-FR-05]
  - id: nouvelles-mentions
    group: identifiants
    name: {en: "The four new mandatory details", fr: "Les quatre nouvelles mentions"}
    text:
      en: "The buyer's SIREN; the delivery address, if it differs from the buyer's; whether the sale is goods, services or both; and the seller's option to pay VAT on debits (when invoicing rather than when paid), if chosen. They follow the reform's calendar: since 1 September 2026, or from 1 September 2027 for small businesses and micro-businesses."
      fr: "Le SIREN du client ; l'adresse de livraison, si elle diffère de celle du client ; la nature des opérations (biens, services, ou les deux) ; et l'option pour la TVA sur les débits (payée à la facturation plutôt qu'au paiement), si le vendeur l'a choisie. Applicables avec le calendrier de la réforme : depuis le 1er septembre 2026, ou le 1er septembre 2027 pour les PME et les micro-entreprises."
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F31808
    source_name: {en: "service-public.fr", fr: "service-public.fr"}
    rules: [BR-FR-11]
  - id: cadre-de-facturation
    group: regles
    name: {en: "Business process type", fr: "Cadre de facturation"}
    text:
      en: "A code at the top of the invoice that tells the platform which case applies. The letter means goods (B), services (S) or both (M); the digit gives the scenario, for example 2 for an invoice already paid, 4 for a final invoice after a deposit. Its business term is BT-23; \"billing framework\" is a literal translation of the French name."
      fr: "Un code en tête de facture qui dit à la plateforme de quel cas il s'agit. La lettre indique des biens (B), des services (S) ou les deux (M) ; le chiffre indique le scénario, par exemple 2 pour une facture déjà payée, 4 pour une facture définitive après acompte. Son terme métier est BT-23."
    source: https://github.com/fnfempe/France_RFE
    source_name:
      en: "FNFE-MPE, France_RFE rules 1.4.0.04"
      fr: "FNFE-MPE, règles France_RFE 1.4.0.04"
    rules: [BR-FR-08, BR-FR-CO-09, BR-FR-CO-08]
  - id: terme-metier
    group: regles
    name: {en: "Business term (BT)", fr: "Terme métier (BT)"}
    text:
      en: "A piece of information defined by the European standard, numbered \"BT-n\": BT-1 is the invoice number, BT-112 the total with VAT. Groups of information are \"BG-n\", such as BG-25, the invoice line. The same term sits in a different place in UBL and in CII."
      fr: "Une information définie par la norme européenne, repérée par un numéro « BT-n » : BT-1 est le numéro de facture, BT-112 le total TTC. Les groupes d'informations sont des « BG-n », comme BG-25, la ligne de facture. Un même terme se place différemment en UBL et en CII."
    source: https://github.com/ConnectingEurope/eInvoicing-EN16931
    source_name:
      en: "CEN, EN 16931 rules"
      fr: "CEN, règles EN 16931"
  - id: regle-de-gestion
    group: regles
    name: {en: "Business rule (BR)", fr: "Règle de gestion (BR)"}
    text:
      en: "A rule saying what an invoice must contain or respect. BR-nn rules check that something is present; BR-CO rules link several fields, often by a calculation; BR-S, BR-E… apply per VAT category; BR-FR are the French reform's rules, published by FNFE-MPE."
      fr: "Une règle qui dit ce qu'une facture doit contenir ou respecter. Les BR-nn vérifient qu'une information est présente ; les BR-CO relient plusieurs informations, souvent par un calcul ; les BR-S, BR-E… sont propres à chaque catégorie de TVA ; les BR-FR sont les règles de la réforme française, publiées par le FNFE-MPE."
    source: https://github.com/fnfempe/France_RFE
    source_name:
      en: "FNFE-MPE and CEN"
      fr: "FNFE-MPE et CEN"
    rules: [BR-CO-10, BR-FR-10]
  - id: schematron
    group: regles
    name: {en: "Schematron", fr: "Schematron"}
    text:
      en: "For developers: a rule language for XML, where each rule is an XPath test with a message. It is how the European rules (CEN 1.3.17) and the French rules (France_RFE 1.4.0.04) are published."
      fr: "Pour les développeurs : un langage de règles pour le XML, où chaque règle est un test XPath accompagné d'un message. C'est la forme sous laquelle sont publiées les règles européennes (CEN 1.3.17) et françaises (France_RFE 1.4.0.04)."
    source: https://github.com/ConnectingEurope/eInvoicing-EN16931
    source_name:
      en: "CEN, EN 16931 rules"
      fr: "CEN, règles EN 16931"
  - id: rejet-refus
    group: regles
    name: {en: "Rejection and refusal", fr: "Rejet et refus"}
    text:
      en: "Rejection is technical: a platform, the issuer's or the recipient's, blocks the invoice because its format or one of its checks fails. Refusal is the buyer's decision to dispute the invoice. The English names are not official."
      fr: "Le rejet est technique : une plateforme, celle de l'émetteur ou du destinataire, bloque la facture parce que son format ou l'un de ses contrôles échoue. Le refus est la décision du client, qui conteste la facture."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054606169
    source_name:
      en: "French tax code, annex IV, art. 41 septies G"
      fr: "Annexe IV du CGI, art. 41 septies G"
  - id: rectificative-avoir
    group: regles
    name: {en: "Corrected invoice and credit note", fr: "Facture rectificative et avoir"}
    text:
      en: "To fix an invoice, you issue either a corrected invoice, or a new one that cancels and replaces it, or a credit note, which reduces or cancels the amount due. Either way, the document cites the original invoice, with its number and date."
      fr: "Pour corriger une facture, on émet soit une facture rectificative, ou une facture qui annule et remplace la première, soit un avoir, qui réduit ou annule la somme due. Dans tous les cas, le document cite la facture d'origine, avec son numéro et sa date."
    source: https://bofip.impots.gouv.fr/bofip/142-PGP.html
    source_name: {en: "BOFiP", fr: "BOFiP"}
    rules: [BR-FR-CO-04, BR-FR-CO-05, BR-FR-04]
  - id: categorie-tva
    group: tva
    name: {en: "VAT category", fr: "Catégorie de TVA"}
    text:
      en: "A code saying how VAT applies, on each line and in the VAT breakdown. France accepts S (standard rate), Z (zero rate), E (exempt, with its reason), AE (reverse charge), K (intra-Community supply), G (export outside the European Union) and O (outside the scope of VAT)."
      fr: "Un code qui dit comment la TVA s'applique, à chaque ligne et dans la ventilation de TVA. La France accepte S (taux normal), Z (taux zéro), E (exonéré, avec son motif), AE (autoliquidation), K (livraison intracommunautaire), G (export hors de l'Union européenne) et O (hors champ de la TVA)."
    source: https://docs.peppol.eu/poacc/billing/3.0/codelist/UNCL5305/
    source_name:
      en: "Peppol, UNCL5305 code list"
      fr: "Peppol, liste UNCL5305"
    rules: [BR-FR-15, BR-CO-04, BR-S-08, BR-E-10]
  - id: autoliquidation
    group: tva
    name: {en: "Reverse charge", fr: "Autoliquidation"}
    text:
      en: "The buyer, not the seller, accounts for and pays the VAT. The seller invoices without VAT and writes \"Autoliquidation\" on the invoice; the VAT category is AE."
      fr: "C'est le client, et non le vendeur, qui déclare et paie la TVA. Le vendeur facture hors taxe et écrit la mention « Autoliquidation » ; la catégorie de TVA est AE."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000050811276
    source_name:
      en: "French tax code, annex II, art. 242 nonies A"
      fr: "Annexe II du CGI, art. 242 nonies A"
  - id: chorus-pro
    group: public
    name: {en: "Chorus Pro", fr: "Chorus Pro"}
    text:
      en: "The public platform, run by the AIFE (the State's financial IT agency), through which suppliers send their invoices to the State, local authorities and public bodies. It remains the public sector's platform under the reform; since September 2026 a supplier may also go through its approved platform, except in some cases such as public works contracts."
      fr: "La plateforme publique, gérée par l'AIFE, par laquelle les fournisseurs envoient leurs factures à l'État, aux collectivités et aux établissements publics. Elle reste la plateforme du secteur public avec la réforme ; depuis septembre 2026, un fournisseur peut aussi passer par sa plateforme agréée, sauf dans certains cas comme les marchés de travaux."
    source: https://www.collectivites-locales.gouv.fr/actualites/facturation-electronique-partir-de-2026-chorus-pro-restera-la-plateforme-de-reference-du-secteur
    source_name: {en: "collectivites-locales.gouv.fr", fr: "collectivites-locales.gouv.fr"}
  - id: code-service
    group: public
    name: {en: "Service code", fr: "Code service"}
    text:
      en: "The code for the department of a public body that pays the invoice. Include it when the public buyer requires it; it is listed in Chorus Pro's directory of public bodies. The English name is not official."
      fr: "Le code qui désigne, dans une entité publique, le service chargé de payer la facture. Il faut l'indiquer lorsque l'acheteur public l'exige ; il figure dans l'annuaire des structures publiques de Chorus Pro."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000038794379
    source_name:
      en: "French public procurement code, art. D2192-2"
      fr: "Code de la commande publique, art. D2192-2"
  - id: numero-engagement
    group: public
    name: {en: "Commitment number", fr: "Numéro d'engagement"}
    text:
      en: "The public order's reference: the purchase order number or, failing that, the contract reference or the commitment number given by the buyer's accounting system. Ask the buyer for it before invoicing. The English name is not official."
      fr: "La référence de la commande publique : le numéro du bon de commande ou, à défaut, la référence du contrat ou le numéro d'engagement donné par le système comptable de l'acheteur. Il se demande à l'acheteur avant de facturer."
    source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000038794379
    source_name:
      en: "French public procurement code, art. D2192-2"
      fr: "Code de la commande publique, art. D2192-2"
  - id: xrechnung
    group: allemagne
    name: {en: "XRechnung", fr: "XRechnung"}
    text:
      en: "Germany's e-invoice format for public administrations, published by KoSIT: a restriction of the European standard plus an extension, in UBL or CII. Version 3.0 has applied since 1 February 2024 and stays valid until at least 31 July 2027; version 4.0 is expected in spring 2027."
      fr: "Le format allemand de facture électronique pour les administrations, publié par la KoSIT : une restriction de la norme européenne plus une extension, en UBL ou en CII. La version 3.0 s'applique depuis le 1er février 2024 et au moins jusqu'au 31 juillet 2027 ; la version 4.0 est attendue au printemps 2027."
    source: https://xeinkauf.de/xrechnung/
    source_name: {en: "KoSIT, xeinkauf.de", fr: "KoSIT, xeinkauf.de"}
