id: BR-CO-20
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-134
- BT-135
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:BillingSpecifiedPeriod
  ubl: /Invoice/cac:InvoiceLine/cac:InvoicePeriod
official_message:
  lang: en
  text: If Invoice line period (BG-26) is used, the Invoice line period start date (BT-134) or the Invoice line period end date (BT-135) shall be filled, or both.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-20
title:
  en: A line's period has neither a start date nor an end date
  fr: La période d'une ligne n'a ni date de début ni date de fin
brief:
  en: If an invoice line gives a period, give at least its start date or its end date.
  fr: Si une ligne de la facture indique une période, donnez au moins sa date de début ou sa date de fin.
search:
  en:
  - BR-CO-20
  - invoice line period start date end date
  - BG-26 BT-134 BT-135
  - BillingSpecifiedPeriod line
  fr:
  - BR-CO-20
  - période de ligne sans date facture électronique
  - BT-134 BT-135
  - erreur BR-CO-20 factur-x
examples:
  source: invoice-examples
  version: 0.3.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-CO-20.xml
topic: lines
related:
- BR-CO-19
- BR-FR-03
updated: '2026-11-16'
