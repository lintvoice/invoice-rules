id: BR-IC-12
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category K, intra-Community supply (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA K, livraison intracommunautaire (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-80
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeDelivery/ram:ShipToTradeParty/ram:PostalTradeAddress/ram:CountryID
  ubl: /Invoice/cac:Delivery/cac:DeliveryLocation/cac:Address/cac:Country/cbc:IdentificationCode
official_message:
  lang: en
  text: In an Invoice with a VAT breakdown (BG-23) where the VAT category code (BT-118) is "Intra-community supply" the Deliver to country code (BT-80) shall not be blank.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-IC-12
title:
  en: An intra-Community supply gives no delivery country
  fr: La livraison intracommunautaire n'indique pas le pays de livraison
brief:
  en: An invoice for an intra-Community supply (K) gives the country the goods are delivered to.
  fr: Une facture de livraison intracommunautaire (K) indique le pays où les biens sont livrés.
search:
  en:
  - BR-IC-12
  - intra-community supply deliver to country missing
  - BT-80 ShipToTradeParty CountryID
  - deliver to address BG-15
  fr:
  - BR-IC-12
  - pays de livraison manquant livraison intracommunautaire
  - BT-80
  - erreur BR-IC-12 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-IC-12.xml
      invalid: examples/en16931/invalid/BR-IC-12.xml
    fr:
      valid: examples/fr/fixed/BR-IC-12.xml
      invalid: examples/fr/invalid/BR-IC-12.xml
topic: vat
related:
- BR-IC-11
- BR-IC-02
- BR-IC-10
updated: '2026-11-24'
