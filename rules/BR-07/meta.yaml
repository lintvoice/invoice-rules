id: BR-07
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-44
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:BuyerTradeParty/ram:Name
  ubl: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName
official_message:
  lang: en
  text: An Invoice shall contain the Buyer name (BT-44).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-07
title:
  en: The buyer's name is missing
  fr: Le nom de l'acheteur manque
brief:
  en: Every invoice must give the buyer's name.
  fr: Toute facture doit indiquer le nom de l'acheteur.
search:
  en:
  - BR-07
  - buyer name missing
  - BT-44 buyer name
  - error BR-07
  fr:
  - BR-07
  - nom de l'acheteur manquant
  - BT-44
  - erreur BR-07 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-07.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-07.xml
topic: parties
related:
- BR-06
- BR-10
updated: '2026-11-23'
