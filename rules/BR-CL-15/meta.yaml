id: BR-CL-15
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-159
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedTradeProduct/ram:OriginTradeCountry/ram:ID
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:OriginCountry/cbc:IdentificationCode
official_message:
  lang: en
  text: Country codes in an invoice MUST be coded using ISO code list 3166-1
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-15
title:
  en: An item's country of origin is not a country code
  fr: Le pays d'origine d'un article n'est pas un code pays
brief:
  en: An item's country of origin must be a two-letter ISO 3166-1 code, such as DE or FR.
  fr: Le pays d'origine d'un article doit être un code ISO 3166-1 à deux lettres, comme DE ou FR.
search:
  en:
  - BR-CL-15
  - item country of origin not valid
  - BT-159 OriginTradeCountry
  - error BR-CL-15
  fr:
  - BR-CL-15
  - pays d'origine article invalide
  - BT-159
  - erreur BR-CL-15 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-15.xml
      invalid: examples/en16931/invalid/BR-CL-15.xml
    fr:
      valid: examples/fr/fixed/BR-CL-15.xml
      invalid: examples/fr/invalid/BR-CL-15.xml
topic: lines
related:
- BR-CL-14
updated: '2026-11-23'
