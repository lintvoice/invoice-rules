id: BR-Z-04
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category Z, zero rate (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA Z, taux zéro (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-31
- BT-32
- BT-63
- BT-102
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:SpecifiedTaxRegistration/ram:ID
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyTaxScheme/cbc:CompanyID
official_message:
  lang: en
  text: An Invoice that contains a Document level charge where the Document level charge VAT category code (BT-102) is "Zero rated" shall contain the Seller VAT Identifier (BT-31), the Seller tax registration
    identifier (BT-32) and/or the Seller tax representative VAT identifier (BT-63).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-Z-04
title:
  en: A zero-rated charge requires the seller's VAT number
  fr: Des frais au taux zéro exigent le numéro de TVA du vendeur
brief:
  en: An invoice with a charge on the whole invoice in the VAT category Z (zero rate) must give the seller's VAT number, or its tax representative's.
  fr: Une facture qui a des frais globaux de la catégorie de TVA Z (taux zéro) doit indiquer le numéro de TVA du vendeur, ou celui de son représentant fiscal.
search:
  en:
  - BR-Z-04
  - VAT category Z VAT identifier
  - BT-31 seller VAT number
  - Zero rated document level charge
  fr:
  - BR-Z-04
  - numéro de TVA catégorie Z facture électronique
  - BT-31
  - erreur BR-Z-04 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-Z-04.xml
      invalid: examples/en16931/invalid/BR-Z-04.xml
topic: vat
related:
- BR-Z-02
- BR-Z-03
- BR-S-02
updated: '2026-11-27'
