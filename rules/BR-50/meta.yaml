id: BR-50
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-84
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementPaymentMeans/ram:PayeePartyCreditorFinancialAccount/ram:IBANID
  ubl: /Invoice/cac:PaymentMeans/cac:PayeeFinancialAccount/cbc:ID
official_message:
  lang: en
  text: A Payment account identifier (BT-84) shall be present if Credit transfer (BG-16) information is provided in the Invoice.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-50
title:
  en: The account to pay is empty
  fr: Le compte à payer est vide
brief:
  en: When the invoice is paid by credit transfer and gives an account, the account's identifier, such as its IBAN, must be filled in.
  fr: Quand la facture se paie par virement et indique un compte, l'identifiant de ce compte, comme son IBAN, doit être rempli.
search:
  en:
  - BR-50
  - payment account identifier missing
  - BT-84 IBAN
  - error BR-50
  fr:
  - BR-50
  - IBAN manquant facture électronique
  - BT-84 IBAN
  - erreur BR-50 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-50.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-50.xml
topic: payment
related:
- BR-61
- BR-49
updated: '2026-11-23'
