id: BR-48
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-119
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:RateApplicablePercent
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:Percent
official_message:
  lang: en
  text: Each VAT breakdown (BG-23) shall have a VAT category rate (BT-119), except if the Invoice is not subject to VAT.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-48
title:
  en: A VAT category has no rate
  fr: Une catégorie de TVA n'a pas de taux
brief:
  en: Each VAT breakdown must give its rate, 0 % included, unless the invoice is outside the scope of VAT.
  fr: Chaque ventilation de TVA doit indiquer son taux, 0 % compris, sauf si la facture est hors du champ de la TVA.
search:
  en:
  - BR-48
  - VAT category rate missing
  - BT-119 RateApplicablePercent
  - error BR-48
  fr:
  - BR-48
  - taux de TVA manquant
  - BT-119
  - erreur BR-48 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-48.xml
      invalid: examples/en16931/invalid/BR-48.xml
    fr:
      valid: examples/fr/fixed/BR-48.xml
      invalid: examples/fr/invalid/BR-48.xml
topic: vat
related:
- BR-47
updated: '2026-11-23'
