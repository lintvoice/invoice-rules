id: BR-IC-10
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category K, intra-Community supply (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA K, livraison intracommunautaire (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-120
- BT-121
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:ExemptionReason
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:TaxExemptionReason
official_message:
  lang: en
  text: A VAT Breakdown (BG-23) with the VAT Category code (BT-118) "Intra-community supply" shall have a VAT exemption reason code (BT-121), meaning "Intra-community supply" or the VAT exemption reason
    text (BT-120) "Intra-community supply" (or the equivalent standard text in another language).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-IC-10
title:
  en: The intra-Community supply gives no exemption reason
  fr: La livraison intracommunautaire n'indique pas son motif d'exonération
brief:
  en: The VAT breakdown in category K (intra-Community supply) gives the reason no VAT is charged, as text or as a code.
  fr: La ventilation de TVA de la catégorie K (livraison intracommunautaire) indique pourquoi aucune TVA n'est facturée, en texte ou sous forme de code.
search:
  en:
  - BR-IC-10
  - VAT category K exemption reason
  - BT-120 BT-121
  - VATEX exemption reason code
  fr:
  - BR-IC-10
  - motif d'exonération catégorie K
  - BT-120 BT-121 VATEX
  - erreur BR-IC-10 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-IC-10.xml
      invalid: examples/en16931/invalid/BR-IC-10.xml
    fr:
      valid: examples/fr/fixed/BR-IC-10.xml
      invalid: examples/fr/invalid/BR-IC-10.xml
topic: vat
related:
- BR-E-10
- BR-IC-01
- BR-CL-22
updated: '2026-11-27'
