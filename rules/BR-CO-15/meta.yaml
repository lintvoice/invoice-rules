id: BR-CO-15
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes: [CII, UBL]
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms: [BT-112, BT-109, BT-110]
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:GrandTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount
official_message:
  lang: en
  text: "Invoice total amount with VAT (BT-112) = Invoice total amount without VAT (BT-109) + Invoice total VAT amount (BT-110)."
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids: [BR-CO-15]
title:
  en: The total with VAT is not the total without VAT plus the VAT
  fr: Le total TTC n'est pas égal au total HT plus la TVA
brief:
  en: "The total with VAT must be exactly the total without VAT plus the VAT, to the cent."
  fr: "Le total TTC doit être exactement le total HT plus la TVA, au centime près."
search:
  en: [BR-CO-15, invoice total with VAT mismatch, BT-112 BT-109 BT-110, GrandTotalAmount, TaxInclusiveAmount]
  fr: [BR-CO-15, total TTC incohérent facture électronique, BT-112, erreur BR-CO-15 factur-x]
examples:
  source: invoice-examples
  version: 0.1.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-CO-15.xml
related: [BR-CO-13, BR-CO-14, BR-CO-16]
updated: 2026-11-16
