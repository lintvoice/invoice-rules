id: BR-IC-11
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category K, intra-Community supply (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA K, livraison intracommunautaire (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-72
- BT-73
- BT-74
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeDelivery/ram:ActualDeliverySupplyChainEvent/ram:OccurrenceDateTime/udt:DateTimeString
  ubl: /Invoice/cac:Delivery/cbc:ActualDeliveryDate
official_message:
  lang: en
  text: In an Invoice with a VAT breakdown (BG-23) where the VAT category code (BT-118) is "Intra-community supply" the Actual delivery date (BT-72) or the Invoicing period (BG-14) shall not be blank.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-IC-11
title:
  en: An intra-Community supply gives no delivery date
  fr: La livraison intracommunautaire n'indique pas de date de livraison
brief:
  en: An invoice for an intra-Community supply (K) gives the actual delivery date, or the invoicing period.
  fr: Une facture de livraison intracommunautaire (K) indique la date de livraison effective, ou la période de facturation.
search:
  en:
  - BR-IC-11
  - intra-community supply delivery date missing
  - BT-72 ActualDeliveryDate
  - BG-14 invoicing period
  fr:
  - BR-IC-11
  - date de livraison manquante livraison intracommunautaire
  - BT-72
  - erreur BR-IC-11 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-IC-11.xml
      invalid: examples/en16931/invalid/BR-IC-11.xml
    fr:
      valid: examples/fr/fixed/BR-IC-11.xml
      invalid: examples/fr/invalid/BR-IC-11.xml
topic: vat
related:
- BR-IC-12
- BR-IC-02
- BR-IC-10
updated: '2026-11-27'
