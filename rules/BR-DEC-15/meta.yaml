id: BR-DEC-15
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-111
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:TaxTotalAmount
  ubl: /Invoice/cac:TaxTotal/cbc:TaxAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Invoice total VAT amount in accounting currency (BT-111) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-15
title:
  en: The VAT total in the VAT accounting currency is not rounded to the cent
  fr: Le total de TVA en devise de comptabilisation n'est pas arrondi au centime
brief:
  en: The VAT total in the VAT accounting currency must be rounded to the cent, with at most 2 decimals.
  fr: Le total de TVA en devise de comptabilisation doit être arrondi au centime, avec au plus 2 décimales.
search:
  en:
  - BR-DEC-15
  - the VAT total in the VAT accounting currency more than 2 decimals
  - BT-111
  - TaxTotalAmount decimals
  fr:
  - BR-DEC-15
  - le total de TVA en devise de comptabilisation plus de 2 décimales
  - BT-111
  - erreur BR-DEC-15 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-DEC-15.xml
      invalid: examples/en16931/invalid/BR-DEC-15.xml
    fr:
      valid: examples/fr/fixed/BR-FR-DEC-01-BT-111.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-111.xml
topic: vat
related:
- BR-DEC-13
- BR-FR-CO-12
- BR-FR-DEC-01
updated: '2026-11-23'
