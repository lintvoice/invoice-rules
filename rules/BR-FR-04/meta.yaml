id: BR-FR-04
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-3
paths:
  cii: rsm:CrossIndustryInvoice/rsm:ExchangedDocument/ram:TypeCode
  ubl: ubl:Invoice/cbc:InvoiceTypeCode | cn:CreditNote/cbc:CreditNoteTypeCode
official_message:
  lang: fr
  text: 'Le code type de document (ram:TypeCode) n’est pas autorisé. Valeurs acceptées : 380, 389, 393, 501, 386, 500, 384, 471, 472, 473, 261, 262, 381, 396, 502, 503.'
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-04_BT-3
- BR-FR-04_EXT-FR-FE-02
- BR-FR-04_EXT-FR-FE-137
title:
  en: The document type is not on the French list
  fr: Le type de document n'est pas dans la liste française
brief:
  en: The document type code must be one of the 16 codes allowed in France, such as 380 for an invoice or 381 for a credit note.
  fr: Le code du type de document doit faire partie des 16 codes admis en France, par exemple 380 pour une facture ou 381 pour un avoir.
search:
  en:
  - BR-FR-04
  - invoice type code France
  - document type code 326
  fr:
  - BR-FR-04
  - code type de document facture
  - type de facture non autorisé
  - erreur BR-FR-04
examples:
  source: invoice-examples
  version: 0.2.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-FR-04.xml
related:
- BR-FR-CO-04
- BR-FR-CO-05
updated: '2026-11-16'
