id: BR-09
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-40
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:PostalTradeAddress/ram:CountryID
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PostalAddress/cac:Country/cbc:IdentificationCode
official_message:
  lang: en
  text: The Seller postal address (BG-5) shall contain a Seller country code (BT-40).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-09
title:
  en: The seller's address has no country
  fr: L'adresse du vendeur n'a pas de pays
brief:
  en: The seller's postal address must give its country, with its two-letter code such as DE or FR.
  fr: L'adresse postale du vendeur doit indiquer son pays, avec son code à deux lettres comme DE ou FR.
search:
  en:
  - BR-09
  - seller country code missing
  - BT-40 CountryID
  - error BR-09
  fr:
  - BR-09
  - code pays du vendeur manquant
  - BT-40 CountryID
  - erreur BR-09 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-09.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-09.xml
topic: parties
related:
- BR-08
- BR-CL-14
- BR-11
updated: '2026-11-23'
