id: BR-04
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-3
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:ExchangedDocument/ram:TypeCode
  ubl: /Invoice/cbc:InvoiceTypeCode
official_message:
  lang: en
  text: An Invoice shall have an Invoice type code (BT-3).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-04
title:
  en: The document type is missing
  fr: Le type de document manque
brief:
  en: Every invoice must say what kind of document it is, an invoice or a credit note for example, with a standard code.
  fr: Toute facture doit dire de quel type de document il s'agit, une facture ou un avoir par exemple, avec un code normalisé.
search:
  en:
  - BR-04
  - invoice type code missing
  - BT-3 TypeCode
  - error BR-04
  fr:
  - BR-04
  - code type de facture manquant
  - BT-3 TypeCode
  - erreur BR-04 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-04.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-04.xml
topic: invoice
related:
- BR-CL-01
- BR-FR-04
updated: '2026-11-23'
