id: BR-CO-22
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-104
- BT-105
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:Reason
  ubl: /Invoice/cac:AllowanceCharge/cbc:AllowanceChargeReason
official_message:
  lang: en
  text: Each Document level charge (BG-21) shall contain a Document level charge reason (BT-104) or a Document level charge reason code (BT-105), or both.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-22
title:
  fr: Des frais globaux n'ont pas de motif
  en: A charge on the whole invoice has no reason
brief:
  fr: 'Les frais globaux doivent indiquer leur motif : en texte, en code, ou les deux.'
  en: 'Each charge on the whole invoice must give its reason: as text, as a code, or both.'
search:
  en:
  - BR-CO-22
  - charge on the whole invoice reason missing
  - BG-21 BT-104 BT-105
  - AllowanceChargeReason
  fr:
  - BR-CO-22
  - frais globaux sans motif facture électronique
  - BT-104 BT-105
  - erreur BR-CO-22 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CO-22.xml
      invalid: examples/en16931/invalid/BR-CO-22.xml
    fr:
      valid: examples/fr/fixed/BR-CO-22.xml
      invalid: examples/fr/invalid/BR-CO-22.xml
topic: lines
related:
- BR-CO-12
- BR-38
- BR-CO-21
updated: '2026-11-17'
