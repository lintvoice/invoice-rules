id: BR-54
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-160
- BT-161
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedTradeProduct/ram:ApplicableProductCharacteristic
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:AdditionalItemProperty
official_message:
  lang: en
  text: Each Item attribute (BG-32) shall contain an Item attribute name (BT-160) and an Item attribute value (BT-161).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-54
title:
  en: An item attribute lacks its name or its value
  fr: Un attribut d'article n'a pas de nom ou de valeur
brief:
  en: Each attribute given for an item, such as its colour or size, must have both a name and a value.
  fr: Chaque attribut indiqué pour un article, comme sa couleur ou sa taille, doit avoir un nom et une valeur.
search:
  en:
  - BR-54
  - item attribute name or value missing
  - BT-160 BT-161
  - error BR-54
  fr:
  - BR-54
  - attribut d'article sans nom ou valeur
  - BT-160 BT-161
  - erreur BR-54 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses an item attribute without its name or its value, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà un attribut d''article sans son nom ou sa valeur, avant même cette règle. Nos exemples ne montrent que des erreurs que
      le format laisse passer.'
topic: lines
related:
- BR-FR-27
- BR-25
updated: '2026-11-23'
