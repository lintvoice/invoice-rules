id: BR-55
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-25
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:InvoiceReferencedDocument/ram:IssuerAssignedID
  ubl: /Invoice/cac:BillingReference/cac:InvoiceDocumentReference/cbc:ID
official_message:
  lang: en
  text: Each Preceding Invoice reference (BG-3) shall contain a Preceding Invoice reference (BT-25).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-55
title:
  en: The preceding invoice's number is missing
  fr: Le numéro de la facture antérieure manque
brief:
  en: When an invoice refers to a preceding invoice, it must give that invoice's number.
  fr: Quand une facture fait référence à une facture antérieure, elle doit en indiquer le numéro.
search:
  en:
  - BR-55
  - preceding invoice reference missing
  - BT-25
  - error BR-55
  fr:
  - BR-55
  - référence facture antérieure manquante
  - BT-25
  - erreur BR-55 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-55.xml
      invalid: examples/en16931/invalid/BR-55.xml
    fr:
      valid: examples/fr/fixed/BR-55.xml
      invalid: examples/fr/invalid/BR-55.xml
topic: corrections
related:
- BR-FR-CO-04
- BR-FR-02
updated: '2026-11-23'
