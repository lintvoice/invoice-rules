id: BR-DEC-13
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-110
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:TaxTotalAmount
  ubl: /Invoice/cac:TaxTotal/cbc:TaxAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Invoice total VAT amount (BT-110) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-13
title:
  en: The VAT total is not rounded to the cent
  fr: Le total de TVA n'est pas arrondi au centime
brief:
  en: The VAT total must be rounded to the cent, with at most 2 decimals.
  fr: Le total de TVA doit être arrondi au centime, avec au plus 2 décimales.
search:
  en:
  - BR-DEC-13
  - the VAT total more than 2 decimals
  - BT-110
  - TaxTotalAmount decimals
  fr:
  - BR-DEC-13
  - le total de TVA plus de 2 décimales
  - BT-110
  - erreur BR-DEC-13 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-DEC-13.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-DEC-13.xml
topic: vat
related:
- BR-DEC-20
- BR-CO-14
- BR-DEC-15
- BR-FR-DEC-01
updated: '2026-11-23'
