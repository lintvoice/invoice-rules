id: BR-DEC-02
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-93
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:BasisAmount
  ubl: /Invoice/cac:AllowanceCharge/cbc:BaseAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Document level allowance base amount (BT-93) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-02
title:
  en: The base amount of an allowance on the whole invoice has more than 2 decimals
  fr: L'assiette d'une remise globale a plus de 2 décimales
brief:
  en: The base amount of an allowance on the whole invoice must be written with at most 2 decimals, rounded to the cent.
  fr: L'assiette d'une remise globale doit être écrite avec au plus 2 décimales, arrondie au centime.
search:
  en:
  - BR-DEC-02
  - the base amount of an allowance on the whole invoice more than 2 decimals
  - BT-93
  - BasisAmount decimals
  fr:
  - BR-DEC-02
  - l'assiette d'une remise globale plus de 2 décimales
  - BT-93
  - erreur BR-DEC-02 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-DEC-02.xml
      invalid: examples/en16931/invalid/BR-DEC-02.xml
    fr:
      valid: examples/fr/fixed/BR-FR-DEC-01-BT-93.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-93.xml
topic: lines
related:
- BR-DEC-01
- BR-FR-DEC-01
updated: '2026-11-23'
