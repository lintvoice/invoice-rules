id: BR-CO-11
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-107
- BT-92
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:AllowanceTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:AllowanceTotalAmount
official_message:
  lang: en
  text: Sum of allowances on document level (BT-107) = Σ Document level allowance amount (BT-92).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-11
title:
  en: The allowance total is not the sum of the allowances
  fr: Le total des remises n'est pas la somme des remises
brief:
  en: The allowance total must be exactly the sum of the allowances on the whole invoice, to the cent.
  fr: Le total des remises doit être exactement la somme des remises accordées sur l'ensemble de la facture, au centime près.
search:
  en:
  - BR-CO-11
  - sum of allowances on document level mismatch
  - BT-107 BT-92
  - AllowanceTotalAmount
  fr:
  - BR-CO-11
  - total des remises incohérent facture électronique
  - BT-107 BT-92
  - erreur BR-CO-11 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CO-11.xml
      invalid: examples/en16931/invalid/BR-CO-11.xml
    fr:
      valid: examples/fr/fixed/BR-CO-11.xml
      invalid: examples/fr/invalid/BR-CO-11.xml
topic: totals
related:
- BR-CO-12
- BR-CO-13
- BR-CO-21
updated: '2026-11-16'
