id: BR-FR-16
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-96
- BT-103
- BT-119
- BT-152
paths:
  cii: rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:CategoryTradeTax
  ubl: cac:AllowanceCharge/cac:TaxCategory
official_message:
  lang: fr
  text: Le taux de TVA (BT-96) doit être exprimé en pourcentage sans symbole « % » et faire partie des valeurs autorisées.
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-16_BT-103
- BR-FR-16_BT-119
- BR-FR-16_BT-152
- BR-FR-16_BT-96
- BR-FR-16_BT-96_BT-103
title:
  en: The VAT rate is not a rate allowed in France
  fr: Le taux de TVA n'est pas un taux admis en France
brief:
  en: The VAT rate must be a number with no % sign, taken from the list of rates allowed in France (20, 10, 5.5, 2.1, 0…).
  fr: Le taux de TVA doit être un nombre sans « % », pris dans la liste des taux admis en France (20, 10, 5.5, 2.1, 0…).
search:
  en:
  - BR-FR-16
  - VAT rate not allowed France
  - VAT rate 21 France invoice
  fr:
  - BR-FR-16
  - taux de TVA invalide facture
  - taux de TVA non autorisé
  - erreur BR-FR-16
examples:
  source: invoice-examples
  version: 0.2.0
  targets:
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-16.xml
topic: vat
related:
- BR-FR-15
- BR-FR-DEC-04
updated: '2026-11-16'
