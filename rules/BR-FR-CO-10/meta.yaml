- BR-FR-CO-10_BT-46-2
- BR-FR-CO-10_BT-60-1
- BR-FR-CO-10_BT-60-2
- BR-FR-CO-10_BT-71-1
- BR-FR-CO-10_BT-71-2
- BR-FR-CO-10_EXT-FR-FE-06-1
- BR-FR-CO-10_EXT-FR-FE-06-2
- BR-FR-CO-10_EXT-FR-FE-115-1
- BR-FR-CO-10_EXT-FR-FE-115-2
- BR-FR-CO-10_EXT-FR-FE-146-1
- BR-FR-CO-10_EXT-FR-FE-146-2
- BR-FR-CO-10_EXT-FR-FE-46-1
- BR-FR-CO-10_EXT-FR-FE-46-2
- BR-FR-CO-10_EXT-FR-FE-69-1
- BR-FR-CO-10_EXT-FR-FE-69-2
- BR-FR-CO-10_EXT-FR-FE-92-1
- BR-FR-CO-10_EXT-FR-FE-92-2
title:
  en: A party identifier does not state its type, or a type is repeated
  fr: Un identifiant de partie n'indique pas son type, ou un type est répété
brief:
  en: Each identifier of a party must state its type (SIRET, GLN…), and a party cannot have two identifiers of the same type.
  fr: Chaque identifiant d'une partie doit dire de quel type il est (SIRET, GLN…), et une partie ne peut pas avoir deux identifiants du même type.
search:
  en:
  - BR-FR-CO-10
  - identifier scheme missing
  - schemeID repeated
  fr:
  - BR-FR-CO-10
  - identifiant sans schéma
  - schemeID en double
  - erreur BR-FR-CO-10
examples:
  source: invoice-examples
  version: 0.2.0
  targets:
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-CO-10.xml
topic: identifiers
related:
