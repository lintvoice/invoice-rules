id: BR-CO-21
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-97
- BT-98
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:Reason
  ubl: /Invoice/cac:AllowanceCharge/cbc:AllowanceChargeReason
official_message:
  lang: en
  text: Each Document level allowance (BG-20) shall contain a Document level allowance reason (BT-97) or a Document level allowance reason code (BT-98), or both.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-21
title:
  fr: Une remise globale n'a pas de motif
  en: An allowance on the whole invoice has no reason
brief:
  fr: 'Chaque remise globale doit indiquer son motif : en texte, en code, ou les deux.'
  en: 'Each allowance on the whole invoice must give its reason: as text, as a code, or both.'
search:
  en:
  - BR-CO-21
  - allowance on the whole invoice reason missing
  - BG-20 BT-97 BT-98
  - AllowanceChargeReason
  fr:
  - BR-CO-21
  - remise globale sans motif facture électronique
  - BT-97 BT-98
  - erreur BR-CO-21 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CO-21.xml
      invalid: examples/en16931/invalid/BR-CO-21.xml
    fr:
      valid: examples/fr/fixed/BR-CO-21.xml
      invalid: examples/fr/invalid/BR-CO-21.xml
topic: lines
related:
- BR-CO-11
- BR-33
- BR-CO-22
updated: '2026-11-17'
