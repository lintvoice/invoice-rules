id: BR-CL-23
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-130
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeDelivery/ram:BilledQuantity/@unitCode
  ubl: /Invoice/cac:InvoiceLine/cbc:InvoicedQuantity/@unitCode
official_message:
  lang: en
  text: Unit code MUST be coded according to the UN/ECE Recommendation 20 with Rec 21 extension
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-23
title:
  en: A unit of measure is not a valid code
  fr: Une unité de mesure n'est pas un code valide
brief:
  en: Each unit of measure must be a code from the UN/ECE list, such as C62 for one unit or HUR for an hour.
  fr: Chaque unité de mesure doit être un code de la liste de la CEE-ONU, comme C62 pour une unité ou HUR pour une heure.
search:
  en:
  - BR-CL-23
  - unit code not valid UN/ECE Recommendation 20
  - BT-130 unitCode
  - error BR-CL-23
  fr:
  - BR-CL-23
  - code unité de mesure invalide
  - BT-130 unitCode
  - erreur BR-CL-23 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-CL-23.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CL-23.xml
topic: lines
related:
- BR-23
updated: '2026-11-23'
