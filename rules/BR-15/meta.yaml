    en: 'No example invoice for this rule: the Factur-X format already refuses an invoice without its amount due, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà une facture sans le net à payer, avant même cette règle. Nos exemples ne montrent que des erreurs que le format laisse
      passer.'
