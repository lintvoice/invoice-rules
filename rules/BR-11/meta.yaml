id: BR-11
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-55
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:BuyerTradeParty/ram:PostalTradeAddress/ram:CountryID
  ubl: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PostalAddress/cac:Country/cbc:IdentificationCode
official_message:
  lang: en
  text: The Buyer postal address shall contain a Buyer country code (BT-55).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-11
title:
  en: The buyer's address has no country
  fr: L'adresse de l'acheteur n'a pas de pays
brief:
  en: The buyer's postal address must give its country, with its two-letter code such as DE or FR.
  fr: L'adresse postale de l'acheteur doit indiquer son pays, avec son code à deux lettres comme DE ou FR.
search:
  en:
  - BR-11
  - buyer country code missing
  - BT-55 CountryID
  - error BR-11
  fr:
  - BR-11
  - code pays de l'acheteur manquant
  - BT-55 CountryID
  - erreur BR-11 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-11.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-11.xml
topic: parties
related:
- BR-10
- BR-CL-14
- BR-09
updated: '2026-11-23'
