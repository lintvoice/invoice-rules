title:
  en: The VAT category is not allowed in France
  fr: La catégorie de TVA n'est pas admise en France
brief:
  en: Every VAT amount must use one of the categories S, E, AE, K, G, O or Z; categories L and M (Canary Islands, Ceuta and Melilla) do not apply in France.
  fr: Chaque montant soumis à TVA doit utiliser une des catégories S, E, AE, K, G, O ou Z ; les catégories L et M (îles Canaries, Ceuta et Melilla) ne s'appliquent pas en France.
search:
