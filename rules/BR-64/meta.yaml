id: BR-64
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-157
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedTradeProduct/ram:GlobalID/@schemeID
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:StandardItemIdentification/cbc:ID/@schemeID
official_message:
  lang: en
  text: The Item standard identifier (BT-157) shall have a Scheme identifier.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-64
title:
  en: An item's standard identifier does not say what kind of identifier it is
  fr: L'identifiant standard d'un article ne dit pas de quel type d'identifiant il s'agit
brief:
  en: An item's standard identifier must say, with a standard code, what kind of identifier it is.
  fr: L'identifiant standard d'un article doit dire, avec un code normalisé, de quel type d'identifiant il s'agit.
search:
  en:
  - BR-64
  - item standard identifier scheme identifier missing
  - BT-157 GTIN schemeID
  - error BR-64
  fr:
  - BR-64
  - identifiant standard d'article sans schéma
  - BT-157 GTIN
  - erreur BR-64 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-64.xml
      invalid: examples/en16931/invalid/BR-64.xml
    fr:
      valid: examples/fr/fixed/BR-64.xml
      invalid: examples/fr/invalid/BR-64.xml
topic: lines
related:
- BR-CL-21
- BR-65
updated: '2026-11-23'
