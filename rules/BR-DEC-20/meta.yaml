id: BR-DEC-20
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-117
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:CalculatedAmount
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the VAT category tax amount (BT-117) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-20
title:
  en: A rate's VAT amount has more than 2 decimals
  fr: Le montant de TVA d'un taux a plus de 2 décimales
brief:
  en: A rate's VAT amount must be written with at most 2 decimals, rounded to the cent.
  fr: Le montant de TVA d'un taux doit être écrit avec au plus 2 décimales, arrondi au centime.
search:
  en:
  - BR-DEC-20
  - a rate's VAT amount more than 2 decimals
  - BT-117
  - CalculatedAmount decimals
  fr:
  - BR-DEC-20
  - le montant de TVA d'un taux plus de 2 décimales
  - BT-117
  - erreur BR-DEC-20 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-DEC-20.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-117.xml
topic: vat
related:
- BR-DEC-19
- BR-CO-17
- BR-FR-DEC-01
updated: '2026-11-23'
