id: BR-14
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-112
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:GrandTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount
official_message:
  lang: en
  text: An Invoice shall have the Invoice total amount with VAT (BT-112).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-14
title:
  en: The total with vat is missing
  fr: Le total TTC manque
brief:
  en: Every invoice must give the total with vat.
  fr: Toute facture doit indiquer le total TTC.
search:
  en:
  - BR-14
  - invoice total amount with VAT missing
  - BT-112 GrandTotalAmount
  - error BR-14
  fr:
  - BR-14
  - total TTC manquant
  - BT-112
  - erreur BR-14 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses an invoice without its total with vat, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà une facture sans le total TTC, avant même cette règle. Nos exemples ne montrent que des erreurs que le format laisse
      passer.'
topic: totals
related:
- BR-CO-15
- BR-13
- BR-15
