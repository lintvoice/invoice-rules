id: BR-FR-05
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-22
paths:
  cii: ''
  ubl: ''
official_message:
  lang: fr
  text: La mention relative aux frais de recouvrement (code PMT) est absente. Elle est obligatoire dans les notes (BG-1).
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-05_BT-22-1
- BR-FR-05_BT-22-2
- BR-FR-05_BT-22-3
- BR-FR-05_BT-22_AAB
- BR-FR-05_BT-22_PMD
- BR-FR-05_BT-22_PMT
title:
  en: 'A mandatory statement is missing: recovery costs, late-payment penalties or discount'
  fr: 'Une mention obligatoire manque : frais de recouvrement, pénalités de retard ou escompte'
brief:
  en: 'The invoice must carry three statements, each in a coded note: the fixed indemnity for recovery costs (PMT), late-payment penalties (PMD) and the early-payment discount or its absence (AAB).'
  fr: 'La facture doit porter trois mentions, chacune dans une note codée : l''indemnité forfaitaire pour frais de recouvrement (PMT), les pénalités de retard (PMD) et l''escompte ou son absence (AAB).'
search:
  en:
  - BR-FR-05
  - PMT PMD AAB invoice note
  - late payment penalties invoice France
  fr:
  - BR-FR-05
  - mention PMT PMD AAB
  - mentions obligatoires facture électronique
  - indemnité forfaitaire 40 euros facture
  - erreur BR-FR-05
examples:
  source: invoice-examples
  version: 0.2.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-FR-05-PMT.xml
related:
- BR-FR-06
updated: '2026-11-16'
