id: BR-O-02
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category O, outside the scope of VAT (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA O, hors du champ de la TVA (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-31
- BT-48
- BT-63
- BT-151
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:SpecifiedTaxRegistration/ram:ID
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyTaxScheme/cbc:CompanyID
official_message:
  lang: en
  text: An Invoice that contains an Invoice line (BG-25) where the Invoiced item VAT category code (BT-151) is "Not subject to VAT" shall not contain the Seller VAT identifier (BT-31), the Seller tax representative
    VAT identifier (BT-63) or the Buyer VAT identifier (BT-48).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-O-02
title:
  en: Lines outside the scope of VAT, yet a VAT number on the invoice
  fr: Les lignes hors du champ de la TVA, avec pourtant un numéro de TVA sur la facture
brief:
  en: 'An invoice with a line outside the scope of VAT (O) must give no VAT number: not the seller''s, not its tax representative''s, not the buyer''s.'
  fr: 'Une facture qui a une ligne hors du champ de la TVA (O) ne doit indiquer aucun numéro de TVA : ni celui du vendeur, ni celui de son représentant fiscal, ni celui de l''acheteur.'
search:
  en:
  - BR-O-02
  - VAT category O VAT identifier
  - BT-31 BT-48
  - Not subject to VAT invoice line
  fr:
  - BR-O-02
  - numéro de TVA catégorie O facture électronique
  - BT-31 BT-48
  - erreur BR-O-02 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-O-02.xml
      invalid: examples/en16931/invalid/BR-O-02.xml
topic: vat
related:
- BR-O-03
- BR-O-04
- BR-S-02
updated: '2026-11-27'
