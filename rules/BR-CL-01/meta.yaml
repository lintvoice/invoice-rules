id: BR-CL-01
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-3
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:ExchangedDocument/ram:TypeCode
  ubl: /Invoice/cbc:InvoiceTypeCode
official_message:
  lang: en
  text: The document type code MUST be coded by the invoice and credit note related code lists of UNTDID 1001.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-01
title:
  en: The document type is not a valid code
  fr: Le type de document n'est pas un code valide
brief:
  en: The document type must be a code from the official list, such as 380 for an invoice or 381 for a credit note.
  fr: Le type de document doit être un code de la liste officielle, comme 380 pour une facture ou 381 pour un avoir.
search:
  en:
  - BR-CL-01
  - invoice type code not valid
  - BT-3 UNTDID 1001
  - error BR-CL-01
  fr:
  - BR-CL-01
  - code type de facture invalide
  - BT-3 UNTDID 1001
  - erreur BR-CL-01 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-CL-01.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CL-01.xml
topic: invoice
related:
- BR-04
- BR-FR-04
updated: '2026-11-23'
