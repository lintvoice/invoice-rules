id: BR-CL-22
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-121
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:ExemptionReasonCode
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:TaxExemptionReasonCode
official_message:
  lang: en
  text: Tax exemption reason code identifier scheme identifier MUST belong to the CEF VATEX code list
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-22
title:
  en: The exemption reason is not a valid code
  fr: Le motif d'exonération n'est pas un code valide
brief:
  en: When an invoice gives the reason for a VAT exemption as a code, the code must come from the VATEX list.
  fr: Quand une facture indique le motif d'une exonération de TVA par un code, ce code doit venir de la liste VATEX.
search:
  en:
  - BR-CL-22
  - VAT exemption reason code not valid VATEX
  - BT-121 VATEX
  - error BR-CL-22
  fr:
  - BR-CL-22
  - code VATEX invalide
  - BT-121 VATEX
  - erreur BR-CL-22 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-22.xml
      invalid: examples/en16931/invalid/BR-CL-22.xml
    fr:
      valid: examples/fr/fixed/BR-CL-22.xml
      invalid: examples/fr/invalid/BR-CL-22.xml
topic: vat
related:
- BR-E-10
updated: '2026-11-23'
