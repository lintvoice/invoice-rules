id: BR-E-03
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category E, exempt (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA E, exonération (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-31
- BT-32
- BT-63
- BT-95
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:SpecifiedTaxRegistration/ram:ID
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyTaxScheme/cbc:CompanyID
official_message:
  lang: en
  text: An Invoice that contains a Document level allowance (BG-20) where the Document level allowance VAT category code (BT-95) is "Exempt from VAT" shall contain the Seller VAT Identifier (BT-31), the
    Seller tax registration identifier (BT-32) and/or the Seller tax representative VAT identifier (BT-63).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-E-03
title:
  en: An exempt allowance requires the seller's VAT number
  fr: Une remise exonérée exige le numéro de TVA du vendeur
brief:
  en: An invoice with an allowance on the whole invoice in the VAT category E (exempt) must give the seller's VAT number, or its tax representative's.
  fr: Une facture qui a une remise globale de la catégorie de TVA E (exonération) doit indiquer le numéro de TVA du vendeur, ou celui de son représentant fiscal.
search:
  en:
  - BR-E-03
  - VAT category E VAT identifier
  - BT-31 seller VAT number
  - Exempt from VAT document level allowance
  fr:
  - BR-E-03
  - numéro de TVA catégorie E facture électronique
  - BT-31
  - erreur BR-E-03 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-E-03.xml
      invalid: examples/en16931/invalid/BR-E-03.xml
    fr:
      valid: examples/fr/fixed/BR-E-03.xml
      invalid: examples/fr/invalid/BR-E-03.xml
topic: vat
related:
- BR-E-02
- BR-E-04
- BR-S-02
updated: '2026-11-27'
