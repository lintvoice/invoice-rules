title:
  en: An amount has more than 2 decimals or an invalid format
  fr: Un montant a plus de 2 décimales ou un format invalide
brief:
  en: Every amount must be written with at most 2 decimals, a dot as decimal separator, and at most 19 digits.
  fr: Chaque montant doit être écrit avec au plus 2 décimales, un point comme séparateur décimal, et 19 chiffres au plus.
search:
  en:
  - BR-FR-DEC-01
  - amount more than 2 decimals e-invoice
  - amount format 19.2
