id: BR-FR-28
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-161
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedTradeProduct/ram:ApplicableProductCharacteristic
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:AdditionalItemProperty
official_message:
  lang: fr
  text: La valeur d’attribut (ram:Value) ou la valeur (ram:ValueMeasure avec unité de mesure) doivent être présents, mais pas les deux
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-28-Value
title:
  en: An item attribute gives its value both as text and as a measure
  fr: Une caractéristique d'article donne sa valeur à la fois en texte et en mesure
brief:
  en: Each item attribute must give its value either as text or as a measure with its unit, not both.
  fr: Chaque caractéristique d'article doit donner sa valeur soit en texte, soit en mesure avec son unité, pas les deux.
search:
  en:
  - BR-FR-28
  - item attribute value and value measure both
  - BT-161
  - ValueMeasure
  fr:
  - BR-FR-28
  - caractéristique article valeur et mesure
  - BT-161
  - erreur BR-FR-28 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    fr:
      valid: examples/fr/fixed/BR-FR-28.xml
      invalid: examples/fr/invalid/BR-FR-28.xml
topic: lines
related:
- BR-FR-27
updated: '2026-11-23'
