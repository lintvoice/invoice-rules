id: BR-46
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-117
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:CalculatedAmount
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxAmount
official_message:
  lang: en
  text: Each VAT breakdown (BG-23) shall have a VAT category tax amount (BT-117).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-46
title:
  en: A VAT rate has no VAT amount
  fr: Un taux de TVA n'a pas de montant de TVA
brief:
  en: Each VAT breakdown must give its VAT amount, even when it is 0.
  fr: Chaque ventilation de TVA doit indiquer son montant de TVA, même nul.
search:
  en:
  - BR-46
  - VAT category tax amount missing
  - BT-117 CalculatedAmount
  - error BR-46
  fr:
  - BR-46
  - montant de TVA par taux manquant
  - BT-117
  - erreur BR-46 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-46.xml
      invalid: examples/en16931/invalid/BR-46.xml
    fr:
      valid: examples/fr/fixed/BR-46.xml
      invalid: examples/fr/invalid/BR-46.xml
topic: vat
related:
- BR-45
- BR-CO-17
updated: '2026-11-23'
