id: BR-G-02
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category G, export outside the EU (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA G, exportation hors de l'UE (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-31
- BT-63
- BT-151
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:SpecifiedTaxRegistration/ram:ID
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyTaxScheme/cbc:CompanyID
official_message:
  lang: en
  text: An Invoice that contains an Invoice line (BG-25) where the Invoiced item VAT category code (BT-151) is "Export outside the EU" shall contain the Seller VAT Identifier (BT-31) or the Seller tax representative
    VAT identifier (BT-63).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-G-02
title:
  en: Exports outside the EU require the seller's VAT number
  fr: Les exportations hors de l'UE exigent le numéro de TVA du vendeur
brief:
  en: An invoice with a line in the VAT category G (export outside the EU) must give the seller's VAT number, or its tax representative's.
  fr: Une facture qui a une ligne de la catégorie de TVA G (exportation hors de l'UE) doit indiquer le numéro de TVA du vendeur, ou celui de son représentant fiscal.
search:
  en:
  - BR-G-02
  - VAT category G VAT identifier
  - BT-31 seller VAT number
  - Export outside the EU invoice line
  fr:
  - BR-G-02
  - numéro de TVA catégorie G facture électronique
  - BT-31
  - erreur BR-G-02 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-G-02.xml
      invalid: examples/en16931/invalid/BR-G-02.xml
    fr:
      valid: examples/fr/fixed/BR-G-02.xml
      invalid: examples/fr/invalid/BR-G-02.xml
topic: vat
related:
- BR-G-03
- BR-G-04
- BR-S-02
updated: '2026-11-24'
