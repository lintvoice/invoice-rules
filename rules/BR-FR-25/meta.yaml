id: BR-FR-25
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-34
- BT-49
paths:
  cii: rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:URIUniversalCommunication/ram:URIID
  ubl: ubl:Invoice/cac:AccountingSupplierParty/cac:Party/cbc:EndpointID | cn:CreditNote/cac:AccountingSupplierParty/cac:Party/cbc:EndpointID
official_message:
  lang: fr
  text: L'adresse électronique (ram:URIID) dépasse 125 caractères.
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-25_BT-34
- BR-FR-25_BT-49
- BR-FR-25_EXT-FR-FE-12
- BR-FR-25_EXT-FR-FE-121
- BR-FR-25_EXT-FR-FE-29
- BR-FR-25_EXT-FR-FE-52
- BR-FR-25_EXT-FR-FE-75
- BR-FR-25_EXT-FR-FE-98
title:
  en: The electronic address is longer than 125 characters
  fr: L'adresse électronique dépasse 125 caractères
brief:
  en: Each electronic address on the invoice must be at most 125 characters long.
  fr: Chaque adresse électronique de la facture doit compter au plus 125 caractères.
search:
  en:
  - BR-FR-25
  - electronic address too long
  - electronic address 125 characters
  fr:
  - BR-FR-25
  - adresse électronique trop longue
  - adresse électronique 125 caractères
  - erreur BR-FR-25
examples:
  source: invoice-examples
  version: 0.2.0
  targets:
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-25.xml
topic: addresses
related:
- BR-FR-23
updated: '2026-11-16'
