id: BR-FR-CO-08
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-3
- BT-23
paths:
  cii: ''
  ubl: ''
official_message:
  lang: fr
  text: Si le cadre de facturation (BT-23) est B4, S4 ou M4 (factures définitives après acompte), alors le type de facture (BT-3) ne peut pas être une facture ou un avoir d’acompte (386, 500, 503).
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-CO-08_BT-23
title:
  en: A final invoice after prepayment has a prepayment type
  fr: Une facture définitive après acompte porte un type d'acompte
brief:
  en: With the billing framework B4, S4 or M4 (final invoice after prepayment), the document type cannot be a prepayment invoice or credit note.
  fr: Avec le cadre de facturation B4, S4 ou M4 (facture définitive après acompte), le type de document ne peut pas être une facture ou un avoir d'acompte.
search:
  en:
  - BR-FR-CO-08
  - final invoice after prepayment S4
  - prepayment invoice 386 framework
  fr:
  - BR-FR-CO-08
  - facture définitive après acompte
  - cadre S4 facture d'acompte
  - erreur BR-FR-CO-08
examples:
  source: invoice-examples
  version: 0.2.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-FR-CO-08.xml
topic: corrections
related:
- BR-FR-08
- BR-FR-CO-07
updated: '2026-11-16'
