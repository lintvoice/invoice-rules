id: BR-10
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms: []
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:BuyerTradeParty/ram:PostalTradeAddress
  ubl: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PostalAddress
official_message:
  lang: en
  text: An Invoice shall contain the Buyer postal address (BG-8).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-10
title:
  en: The buyer has no postal address
  fr: L'acheteur n'a pas d'adresse postale
brief:
  en: Every invoice must give the buyer's postal address, with at least its country.
  fr: Toute facture doit indiquer l'adresse postale de l'acheteur, avec au moins son pays.
search:
  en:
  - BR-10
  - buyer postal address missing
  - BG-8 buyer address
  - error BR-10
  fr:
  - BR-10
  - adresse de l'acheteur manquante
  - BG-8 adresse postale
  - erreur BR-10 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-10.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-10.xml
topic: parties
related:
- BR-11
- BR-07
- BR-08
updated: '2026-11-23'
