id: BR-CO-24
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-144
- BT-145
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:Reason
  ubl: /Invoice/cac:InvoiceLine/cac:AllowanceCharge/cbc:AllowanceChargeReason
official_message:
  lang: en
  text: Each Invoice line charge (BG-28) shall contain an Invoice line charge reason (BT-144) or an Invoice line charge reason code (BT-145), or both.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-24
title:
  fr: Des frais sur ligne n'ont pas de motif
  en: A line charge has no reason
brief:
  fr: 'Les frais sur ligne doivent indiquer leur motif : en texte, en code, ou les deux.'
  en: 'Each charge on an invoice line must give its reason: as text, as a code, or both.'
search:
  en:
  - BR-CO-24
  - charge on an invoice line reason missing
  - BG-28 BT-144 BT-145
  - AllowanceChargeReason
  fr:
  - BR-CO-24
  - frais sur ligne sans motif facture électronique
  - BT-144 BT-145
  - erreur BR-CO-24 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CO-24.xml
      invalid: examples/en16931/invalid/BR-CO-24.xml
    fr:
      valid: examples/fr/fixed/BR-CO-24.xml
      invalid: examples/fr/invalid/BR-CO-24.xml
topic: lines
related:
- BR-CO-23
- BR-44
- BR-CO-22
updated: '2026-11-17'
