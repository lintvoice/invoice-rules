id: BR-CL-16
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-81
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementPaymentMeans/ram:TypeCode
  ubl: /Invoice/cac:PaymentMeans/cbc:PaymentMeansCode
official_message:
  lang: en
  text: Payment means in an invoice MUST be coded using UNTDID 4461 code list
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-16
title:
  en: The payment means is not a valid code
  fr: Le moyen de paiement n'est pas un code valide
brief:
  en: The payment means must be a code from the official list, such as 58 for a SEPA credit transfer.
  fr: Le moyen de paiement doit être un code de la liste officielle, comme 58 pour un virement SEPA.
search:
  en:
  - BR-CL-16
  - payment means code not valid
  - BT-81 UNTDID 4461
  - error BR-CL-16
  fr:
  - BR-CL-16
  - code moyen de paiement invalide
  - BT-81 UNTDID 4461
  - erreur BR-CL-16 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-CL-16.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CL-16.xml
topic: payment
related:
- BR-49
- BR-61
updated: '2026-11-23'
