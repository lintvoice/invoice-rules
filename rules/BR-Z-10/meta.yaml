id: BR-Z-10
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category Z, zero rate (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA Z, taux zéro (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-120
- BT-121
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:ExemptionReason
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:TaxExemptionReason
official_message:
  lang: en
  text: A VAT Breakdown (BG-23) with VAT Category code (BT-118) "Zero rated" shall not have a VAT exemption reason code (BT-121) or VAT exemption reason text (BT-120).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-Z-10
title:
  en: A zero-rated VAT breakdown gives an exemption reason
  fr: La ventilation de TVA au taux zéro indique un motif d'exonération
brief:
  en: An exemption reason belongs to the categories without VAT; the VAT breakdown in category Z (zero rate) gives none.
  fr: Un motif d'exonération est propre aux catégories sans TVA ; la ventilation de TVA de la catégorie Z (taux zéro) n'en indique pas.
search:
  en:
  - BR-Z-10
  - VAT category Z exemption reason
  - BT-120 BT-121
  - VATEX exemption reason code
  fr:
  - BR-Z-10
  - motif d'exonération catégorie Z
  - BT-120 BT-121 VATEX
  - erreur BR-Z-10 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-Z-10.xml
      invalid: examples/en16931/invalid/BR-Z-10.xml
topic: vat
related:
- BR-E-10
- BR-S-10
- BR-CL-22
updated: '2026-11-27'
