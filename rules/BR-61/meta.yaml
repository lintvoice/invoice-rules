id: BR-61
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-84
- BT-81
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementPaymentMeans/ram:PayeePartyCreditorFinancialAccount
  ubl: /Invoice/cac:PaymentMeans/cac:PayeeFinancialAccount/cbc:ID
official_message:
  lang: en
  text: If the Payment means type code (BT-81) means SEPA credit transfer, Local credit transfer or Non-SEPA international credit transfer, the Payment account identifier (BT-84) shall be present.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-61
title:
  en: A credit transfer gives no account
  fr: Un virement n'indique pas de compte
brief:
  en: 'When the invoice is paid by credit transfer, it must give the account to pay into: its IBAN, or its account number outside the IBAN system.'
  fr: 'Quand la facture se paie par virement, elle doit indiquer le compte sur lequel payer : son IBAN, ou son numéro de compte hors du système IBAN.'
search:
  en:
  - BR-61
  - payment account identifier missing credit transfer
  - BT-84 IBAN
  - error BR-61
  fr:
  - BR-61
  - IBAN manquant virement facture électronique
  - BT-84
  - erreur BR-61 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-61.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-61.xml
topic: payment
related:
- BR-50
- BR-49
- BR-CL-16
updated: '2026-11-23'
