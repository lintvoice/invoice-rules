id: BR-CL-13
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-158
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedTradeProduct/ram:DesignatedProductClassification/ram:ClassCode/@listID
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:CommodityClassification/cbc:ItemClassificationCode/@listID
official_message:
  lang: en
  text: Item classification identifier identification scheme identifier MUST be coded using one of the UNTDID 7143 list.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-13
title:
  en: An item's classification system is not a valid code
  fr: Le système de classification d'un article n'est pas un code valide
brief:
  en: The code that says which classification system an item's class comes from must be in the official list, such as TST for UNSPSC.
  fr: Le code qui dit de quel système de classification vient la classe d'un article doit être dans la liste officielle, comme TST pour UNSPSC.
search:
  en:
  - BR-CL-13
  - item classification scheme not valid
  - BT-158 listID UNTDID 7143
  - error BR-CL-13
  fr:
  - BR-CL-13
  - listID classification article invalide
  - BT-158 listID
  - erreur BR-CL-13 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-13.xml
      invalid: examples/en16931/invalid/BR-CL-13.xml
    fr:
      valid: examples/fr/fixed/BR-CL-13.xml
      invalid: examples/fr/invalid/BR-CL-13.xml
topic: lines
related:
- BR-65
- BR-CL-21
updated: '2026-11-23'
