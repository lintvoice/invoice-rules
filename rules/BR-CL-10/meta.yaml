id: BR-CL-10
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-29
- BT-46
- BT-60
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:GlobalID/@schemeID
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyIdentification/cbc:ID/@schemeID
official_message:
  lang: en
  text: Any identifier identification scheme identifier MUST be coded using one of the ISO 6523 ICD list.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-10
title:
  en: A company identifier's kind is not a valid code
  fr: Le type d'un identifiant d'entreprise n'est pas un code valide
brief:
  en: The code that says which register a party's identifier comes from must be in the ISO 6523 list, such as 0088 for a GLN.
  fr: Le code qui dit de quel registre vient l'identifiant d'une partie doit être dans la liste ISO 6523, comme 0088 pour un GLN.
search:
  en:
  - BR-CL-10
  - identifier scheme not in ISO 6523 ICD
  - schemeID BT-29
  - error BR-CL-10
  fr:
  - BR-CL-10
  - schemeID identifiant invalide ISO 6523
  - BT-29 schemeID
  - erreur BR-CL-10 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-CL-10.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CL-10.xml
topic: identifiers
related:
- BR-CL-11
- BR-CL-21
- BR-CL-26
- BR-FR-CO-10
updated: '2026-11-23'
