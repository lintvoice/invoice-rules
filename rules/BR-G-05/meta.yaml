id: BR-G-05
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category G, export outside the EU (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA G, exportation hors de l'UE (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-151
- BT-152
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:ApplicableTradeTax/ram:RateApplicablePercent
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:ClassifiedTaxCategory/cbc:Percent
official_message:
  lang: en
  text: In an Invoice line (BG-25) where the Invoiced item VAT category code (BT-151) is "Export outside the EU" the Invoiced item VAT rate (BT-152) shall be 0 (zero).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-G-05
title:
  en: An export line must have a 0% rate
  fr: Une ligne d'exportation doit avoir un taux de 0 %
brief:
  en: In the VAT category G (export outside the EU), the VAT rate of an invoice line is 0%.
  fr: Dans la catégorie de TVA G (exportation hors de l'UE), le taux de TVA d'une ligne est de 0 %.
search:
  en:
  - BR-G-05
  - VAT category G rate BT-152
  - Export outside the EU VAT rate
  - BT-152
  fr:
  - BR-G-05
  - taux de TVA catégorie G
  - BT-152
  - erreur BR-G-05 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-G-05.xml
      invalid: examples/en16931/invalid/BR-G-05.xml
    fr:
      valid: examples/fr/fixed/BR-G-05.xml
      invalid: examples/fr/invalid/BR-G-05.xml
topic: vat
related:
- BR-G-06
- BR-G-07
- BR-S-05
updated: '2026-11-27'
