id: BR-27
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-146
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeAgreement/ram:NetPriceProductTradePrice/ram:ChargeAmount
  ubl: /Invoice/cac:InvoiceLine/cac:Price/cbc:PriceAmount
official_message:
  lang: en
  text: The Item net price (BT-146) shall NOT be negative.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-27
title:
  fr: Le prix net d'une ligne est négatif
  en: A line's net price is negative
brief:
  fr: 'Le prix unitaire net d''une ligne ne peut pas être négatif : une remise se déclare comme une remise, pas comme une ligne à prix négatif.'
  en: 'A line''s net unit price cannot be negative: enter a discount as an allowance, not as a line at a negative price.'
search:
  en:
  - BR-27
  - negative item net price
  - negative line price e-invoice
  - BT-146 negative
  fr:
  - BR-27
  - prix négatif facture électronique
  - ligne de remise négative factur-x
  - erreur BR-27 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-27.xml
      invalid: examples/en16931/invalid/BR-27.xml
    fr:
      valid: examples/fr/fixed/BR-27.xml
      invalid: examples/fr/invalid/BR-27.xml
topic: lines
related:
- BR-26
- BR-FR-DEC-03
- BR-CO-21
updated: '2026-11-18'
