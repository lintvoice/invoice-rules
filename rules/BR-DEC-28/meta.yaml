id: BR-DEC-28
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-142
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:BasisAmount
  ubl: /Invoice/cac:InvoiceLine/cac:AllowanceCharge/cbc:BaseAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Invoice line charge base amount (BT-142) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-28
title:
  en: The base amount of a line charge has more than 2 decimals
  fr: L'assiette de frais sur ligne a plus de 2 décimales
brief:
  en: The base amount of a line charge must be written with at most 2 decimals, rounded to the cent.
  fr: L'assiette de frais sur ligne doit être écrite avec au plus 2 décimales, arrondie au centime.
search:
  en:
  - BR-DEC-28
  - the base amount of a line charge more than 2 decimals
  - BT-142
  - BasisAmount decimals
  fr:
  - BR-DEC-28
  - l'assiette de frais sur ligne plus de 2 décimales
  - BT-142
  - erreur BR-DEC-28 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-DEC-28.xml
      invalid: examples/en16931/invalid/BR-DEC-28.xml
    fr:
      valid: examples/fr/fixed/BR-FR-DEC-01-BT-142.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-142.xml
topic: lines
related:
- BR-DEC-27
- BR-FR-DEC-01
updated: '2026-11-23'
