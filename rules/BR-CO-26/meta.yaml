id: BR-CO-26
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-29
- BT-30
- BT-31
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party
official_message:
  lang: en
  text: In order for the buyer to automatically identify a supplier, the Seller identifier (BT-29), the Seller legal registration identifier (BT-30) and/or the Seller VAT identifier (BT-31) shall be present.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-26
title:
  fr: Le vendeur n'a aucun identifiant
  en: The seller has no identifier
brief:
  fr: 'Indiquez au moins un identifiant du vendeur : son SIRET, son SIREN ou son numéro de TVA. En France, le SIREN est de toute façon exigé.'
  en: 'Give at least one identifier of the seller: its SIRET, its SIREN or its VAT number. In France, the SIREN is required anyway.'
search:
  en:
  - BR-CO-26
  - seller identifier missing
  - BT-29 BT-30 BT-31
  - SellerTradeParty
  fr:
  - BR-CO-26
  - identifiant du vendeur manquant facture électronique
  - BT-29 BT-30 BT-31
  - erreur BR-CO-26 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-CO-26.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CO-26.xml
topic: identifiers
related:
- BR-FR-10
- BR-CO-09
updated: '2026-11-17'
