id: BR-30
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-134
- BT-135
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:BillingSpecifiedPeriod
  ubl: /Invoice/cac:InvoiceLine/cac:InvoicePeriod
official_message:
  lang: en
  text: If both Invoice line period start date (BT-134) and Invoice line period end date (BT-135) are given then the Invoice line period end date (BT-135) shall be later or equal to the Invoice line period
    start date (BT-134).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-30
title:
  en: The line period ends before it starts
  fr: La période d'une ligne finit avant de commencer
brief:
  en: When the line period gives both dates, the end date must not be before the start date.
  fr: Quand la période d'une ligne indique ses deux dates, la date de fin ne doit pas précéder la date de début.
search:
  en:
  - BR-30
  - invoice line period end date before start date
  - BT-134 BT-135
  - error BR-30
  fr:
  - BR-30
  - période de ligne dates inversées
  - BT-134 BT-135
  - erreur BR-30 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-30.xml
      invalid: examples/en16931/invalid/BR-30.xml
    fr:
      valid: examples/fr/fixed/BR-30.xml
      invalid: examples/fr/invalid/BR-30.xml
topic: lines
related:
- BR-29
- BR-CO-20
updated: '2026-11-23'
