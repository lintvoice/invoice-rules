id: BR-24
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-131
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:SpecifiedTradeSettlementLineMonetarySummation/ram:LineTotalAmount
  ubl: /Invoice/cac:InvoiceLine/cbc:LineExtensionAmount
official_message:
  lang: en
  text: Each Invoice line (BG-25) shall have an Invoice line net amount (BT-131).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-24
title:
  en: A line has no net amount
  fr: Une ligne n'a pas de montant net
brief:
  en: Each invoice line must give its net amount.
  fr: Chaque ligne de facture doit indiquer son montant net.
search:
  en:
  - BR-24
  - invoice line net amount missing
  - BT-131 LineTotalAmount
  - error BR-24
  fr:
  - BR-24
  - montant net de ligne manquant
  - BT-131
  - erreur BR-24 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses an invoice line without its net amount, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà une ligne de facture sans son montant net, avant même cette règle. Nos exemples ne montrent que des erreurs que le format
      laisse passer.'
topic: lines
related:
- BR-CO-10
- BR-16
- BR-26
updated: '2026-11-23'
