id: BR-CL-08
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-21
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:ExchangedDocument/ram:IncludedNote/ram:SubjectCode
  ubl: /Invoice/cbc:Note
official_message:
  lang: en
  text: Subject Code MUST be coded using a restriction of UNTDID 4451.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-08
title:
  en: A note's subject is not a valid code
  fr: Le sujet d'une note n'est pas un code valide
brief:
  en: When a note of the invoice gives its subject as a code, the code must come from the official list.
  fr: Quand une note de la facture indique son sujet par un code, ce code doit venir de la liste officielle.
search:
  en:
  - BR-CL-08
  - invoice note subject code not valid
  - BT-21 UNTDID 4451
  - error BR-CL-08
  fr:
  - BR-CL-08
  - code sujet de note invalide
  - BT-21 UNTDID 4451
  - erreur BR-CL-08 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-08.xml
      invalid: examples/en16931/invalid/BR-CL-08.xml
    fr:
      valid: examples/fr/fixed/BR-CL-08.xml
      invalid: examples/fr/invalid/BR-CL-08.xml
topic: payment
related:
- BR-FR-05
updated: '2026-11-23'
