id: BR-DEC-11
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-108
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:ChargeTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:ChargeTotalAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Sum of charges on document level (BT-108) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-11
title:
  en: The charge total has more than 2 decimals
  fr: Le total des frais a plus de 2 décimales
brief:
  en: The charge total must be written with at most 2 decimals, rounded to the cent.
  fr: Le total des frais doit être écrit avec au plus 2 décimales, arrondi au centime.
search:
  en:
  - BR-DEC-11
  - the charge total more than 2 decimals
  - BT-108
  - ChargeTotalAmount decimals
  fr:
  - BR-DEC-11
  - le total des frais plus de 2 décimales
  - BT-108
  - erreur BR-DEC-11 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-DEC-11.xml
      invalid: examples/en16931/invalid/BR-DEC-11.xml
    fr:
      valid: examples/fr/fixed/BR-FR-DEC-01-BT-108.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-108.xml
topic: totals
related:
- BR-DEC-05
- BR-CO-12
- BR-FR-DEC-01
updated: '2026-11-23'
