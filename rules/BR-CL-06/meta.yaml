id: BR-CL-06
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-8
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:DueDateTypeCode
  ubl: /Invoice/cac:InvoicePeriod/cbc:DescriptionCode
official_message:
  lang: en
  text: Value added tax point date code MUST be coded using a restriction of UNTDID 2475.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-06
title:
  en: The VAT due date code is not a valid code
  fr: Le code d'exigibilité de la TVA n'est pas un code valide
brief:
  en: The code that says when the VAT becomes due must be one of the three codes allowed in the invoice's syntax.
  fr: Le code qui dit quand la TVA devient exigible doit être l'un des trois codes admis dans la syntaxe de la facture.
search:
  en:
  - BR-CL-06
  - VAT point date code not valid
  - BT-8 DueDateTypeCode
  - error BR-CL-06
  fr:
  - BR-CL-06
  - code date d'exigibilité TVA invalide
  - BT-8 DueDateTypeCode
  - erreur BR-CL-06 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-06.xml
      invalid: examples/en16931/invalid/BR-CL-06.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CL-06.xml
topic: vat
related:
- BR-CO-03
updated: '2026-11-23'
