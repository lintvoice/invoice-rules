id: BR-CL-26
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-71
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeDelivery/ram:ShipToTradeParty/ram:GlobalID/@schemeID
  ubl: /Invoice/cac:Delivery/cac:DeliveryLocation/cbc:ID/@schemeID
official_message:
  lang: en
  text: Delivery location identifier scheme identifier MUST belong to the ISO 6523 ICD code list
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-26
title:
  en: A delivery place identifier's kind is not a valid code
  fr: Le type de l'identifiant du lieu de livraison n'est pas un code valide
brief:
  en: The code that says what kind of identifier the delivery place has must be in the ISO 6523 list, such as 0088 for a GLN.
  fr: Le code qui dit de quel type est l'identifiant du lieu de livraison doit être dans la liste ISO 6523, comme 0088 pour un GLN.
search:
  en:
  - BR-CL-26
  - delivery location identifier scheme not valid
  - BT-71 schemeID
  - error BR-CL-26
  fr:
  - BR-CL-26
  - schéma lieu de livraison invalide
  - BT-71 GLN 0088
  - erreur BR-CL-26 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-26.xml
      invalid: examples/en16931/invalid/BR-CL-26.xml
    fr:
      valid: examples/fr/fixed/BR-CL-26.xml
      invalid: examples/fr/invalid/BR-CL-26.xml
topic: identifiers
related:
- BR-CL-10
- BR-57
updated: '2026-11-23'
