id: BR-CO-03
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-7
- BT-8
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:TaxPointDate
  ubl: /Invoice/cbc:TaxPointDate
official_message:
  lang: en
  text: Value added tax point date (BT-7) and Value added tax point date code (BT-8) are mutually exclusive.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-03
title:
  en: Both a VAT point date and a VAT point date code are given
  fr: La date et le code d'exigibilité de la TVA sont tous deux indiqués
brief:
  en: Give either the VAT point date or its code, never both.
  fr: Indiquez soit la date d'exigibilité de la TVA, soit son code, jamais les deux.
search:
  en:
  - BR-CO-03
  - VAT point date and VAT point date code
  - BT-7 BT-8
  - TaxPointDate DueDateTypeCode
  fr:
  - BR-CO-03
  - date d'exigibilité de la TVA facture électronique
  - BT-7 BT-8
  - erreur BR-CO-03 factur-x
examples:
  source: invoice-examples
  version: 0.3.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-CO-03.xml
topic: vat
related:
- BR-FR-03
updated: '2026-11-16'
