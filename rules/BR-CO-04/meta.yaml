id: BR-CO-04
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-151
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:ApplicableTradeTax/ram:CategoryCode
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:ClassifiedTaxCategory/cbc:ID
official_message:
  lang: en
  text: Each Invoice line (BG-25) shall be categorized with an Invoiced item VAT category code (BT-151).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-04
title:
  fr: Une ligne n'a pas de catégorie de TVA
  en: An invoice line has no VAT category
brief:
  fr: Chaque ligne de la facture doit indiquer sa catégorie de TVA, par exemple le taux normal ou une exonération.
  en: Each invoice line must give its VAT category, for example the standard rate or an exemption.
search:
  en:
  - BR-CO-04
  - invoice line VAT category code missing
  - BT-151
  - ClassifiedTaxCategory
  fr:
  - BR-CO-04
  - catégorie de TVA ligne facture électronique
  - BT-151
  - erreur BR-CO-04 factur-x
examples:
  source: invoice-examples
  version: 0.3.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-CO-04.xml
topic: vat
related:
- BR-CO-18
- BR-CO-17
updated: '2026-11-17'
