id: BR-AE-08
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category AE, reverse charge (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA AE, autoliquidation (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-116
- BT-131
- BT-92
- BT-99
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:BasisAmount
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxableAmount
official_message:
  lang: en
  text: In a VAT breakdown (BG-23) where the VAT category code (BT-118) is "Reverse charge" the VAT category taxable amount (BT-116) shall equal the sum of Invoice line net amounts (BT-131) minus the sum
    of Document level allowance amounts (BT-92) plus the sum of Document level charge amounts (BT-99) where the VAT category codes (BT-151, BT-95, BT-102) are "Reverse charge".
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-AE-08
title:
  en: The taxable amount for reverse charge does not match the lines
  fr: La base de l'autoliquidation ne correspond pas aux lignes
brief:
  en: In the VAT breakdown, the taxable amount of category AE (reverse charge) is the sum of its lines, plus its charges, minus its allowances.
  fr: Dans la ventilation de TVA, la base de la catégorie AE (autoliquidation) est la somme de ses lignes, plus ses frais, moins ses remises.
search:
  en:
  - BR-AE-08
  - VAT category AE taxable amount
  - BT-116 BasisAmount
  - Reverse charge taxable amount
  fr:
  - BR-AE-08
  - base de TVA catégorie AE
  - BT-116
  - erreur BR-AE-08 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-AE-08.xml
      invalid: examples/en16931/invalid/BR-AE-08.xml
    fr:
      valid: examples/fr/fixed/BR-AE-08.xml
      invalid: examples/fr/invalid/BR-AE-08.xml
topic: vat
related:
- BR-AE-09
- BR-AE-01
- BR-S-08
updated: '2026-11-27'
