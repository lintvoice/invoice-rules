id: BR-12
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-106
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:LineTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:LineExtensionAmount
official_message:
  lang: en
  text: An Invoice shall have the Sum of Invoice line net amount (BT-106).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-12
title:
  en: The total of the lines is missing
  fr: Le total des lignes HT manque
brief:
  en: Every invoice must give the total of the lines.
  fr: Toute facture doit indiquer le total des lignes HT.
search:
  en:
  - BR-12
  - sum of invoice line net amount missing
  - BT-106 LineTotalAmount
  - error BR-12
  fr:
  - BR-12
  - total des lignes HT manquant
  - BT-106
  - erreur BR-12 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses an invoice without its total of the lines, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà une facture sans le total des lignes HT, avant même cette règle. Nos exemples ne montrent que des erreurs que le format
      laisse passer.'
topic: totals
related:
- BR-CO-10
- BR-13
