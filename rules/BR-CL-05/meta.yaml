id: BR-CL-05
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-6
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:TaxCurrencyCode
  ubl: /Invoice/cbc:TaxCurrencyCode
official_message:
  lang: en
  text: Tax currency code MUST be coded using ISO code list 4217 alpha-3
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-05
title:
  en: The VAT accounting currency is not a valid code
  fr: La devise de comptabilisation de la TVA n'est pas un code valide
brief:
  en: The currency in which the seller accounts for VAT must be a three-letter ISO 4217 code, such as EUR.
  fr: La devise dans laquelle le vendeur comptabilise la TVA doit être un code ISO 4217 à trois lettres, comme EUR.
search:
  en:
  - BR-CL-05
  - tax currency code not valid
  - BT-6 TaxCurrencyCode
  - error BR-CL-05
  fr:
  - BR-CL-05
  - devise de comptabilisation TVA invalide
  - BT-6
  - erreur BR-CL-05 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-05.xml
      invalid: examples/en16931/invalid/BR-CL-05.xml
    fr:
      valid: examples/fr/fixed/BR-CL-05.xml
      invalid: examples/fr/invalid/BR-CL-05.xml
topic: vat
related:
- BR-53
- BR-CL-04
- BR-FR-CO-12
updated: '2026-11-23'
