  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem
  ubl: /Invoice/cac:InvoiceLine
official_message:
  lang: en
  text: An Invoice shall have at least one Invoice line (BG-25).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-16
title:
  fr: La facture n'a aucune ligne
