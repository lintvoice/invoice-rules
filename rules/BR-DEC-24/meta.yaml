id: BR-DEC-24
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-136
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:ActualAmount
  ubl: /Invoice/cac:InvoiceLine/cac:AllowanceCharge/cbc:Amount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Invoice line allowance amount (BT-136) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-24
title:
  en: The amount of a line allowance has more than 2 decimals
  fr: Le montant d'une remise sur ligne a plus de 2 décimales
brief:
  en: The amount of a line allowance must be written with at most 2 decimals, rounded to the cent.
  fr: Le montant d'une remise sur ligne doit être écrit avec au plus 2 décimales, arrondi au centime.
search:
  en:
  - BR-DEC-24
  - the amount of a line allowance more than 2 decimals
  - BT-136
  - ActualAmount decimals
  fr:
  - BR-DEC-24
  - le montant d'une remise sur ligne plus de 2 décimales
  - BT-136
  - erreur BR-DEC-24 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-DEC-24.xml
      invalid: examples/en16931/invalid/BR-DEC-24.xml
    fr:
      valid: examples/fr/fixed/BR-FR-DEC-01-BT-136.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-136.xml
topic: lines
related:
- BR-DEC-25
- BR-CO-23
- BR-FR-DEC-01
updated: '2026-11-23'
