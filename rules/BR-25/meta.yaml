id: BR-25
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-153
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedTradeProduct/ram:Name
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cbc:Name
official_message:
  lang: en
  text: Each Invoice line (BG-25) shall contain the Item name (BT-153).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-25
title:
  en: A line has no item name
  fr: Une ligne n'a pas de désignation
brief:
  en: Each invoice line must name what it invoices.
  fr: Chaque ligne de facture doit nommer ce qu'elle facture.
search:
  en:
  - BR-25
  - item name missing
  - BT-153 item name
  - error BR-25
  fr:
  - BR-25
  - désignation de l'article manquante
  - BT-153
  - erreur BR-25 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-25.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-25.xml
topic: lines
related:
- BR-21
- BR-16
updated: '2026-11-23'
