id: BR-E-07
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category E, exempt (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA E, exonération (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-102
- BT-103
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:CategoryTradeTax/ram:RateApplicablePercent
  ubl: /Invoice/cac:AllowanceCharge/cac:TaxCategory/cbc:Percent
official_message:
  lang: en
  text: In a Document level charge (BG-21) where the Document level charge VAT category code (BT-102) is "Exempt from VAT", the Document level charge VAT rate (BT-103) shall be 0 (zero).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-E-07
title:
  en: An exempt charge must have a 0 % rate
  fr: Des frais exonérés doivent avoir un taux de 0 %
brief:
  en: In the VAT category E (exempt), the VAT rate of a document level charge is 0 %.
  fr: Dans la catégorie de TVA E (exonération), le taux de TVA des frais au niveau du document est de 0 %.
search:
  en:
  - BR-E-07
  - VAT category E rate BT-103
  - Exempt from VAT VAT rate
  - BT-103
  fr:
  - BR-E-07
  - taux de TVA catégorie E
  - BT-103
  - erreur BR-E-07 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-E-07.xml
      invalid: examples/en16931/invalid/BR-E-07.xml
    fr:
      valid: examples/fr/fixed/BR-E-07.xml
      invalid: examples/fr/invalid/BR-E-07.xml
topic: vat
related:
- BR-E-05
- BR-E-06
- BR-S-05
updated: '2026-11-24'
