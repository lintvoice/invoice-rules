id: BR-28
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-148
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeAgreement/ram:GrossPriceProductTradePrice/ram:ChargeAmount
  ubl: /Invoice/cac:InvoiceLine/cac:Price/cac:AllowanceCharge/cbc:BaseAmount
official_message:
  lang: en
  text: The Item gross price (BT-148) shall NOT be negative.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-28
title:
  en: A line's gross price is negative
  fr: Le prix brut d'une ligne est négatif
brief:
  en: An item's gross price, its price before the price discount, must not be negative.
  fr: Le prix brut d'un article, son prix avant rabais, ne doit pas être négatif.
search:
  en:
  - BR-28
  - item gross price negative
  - BT-148 GrossPriceProductTradePrice
  - error BR-28
  fr:
  - BR-28
  - prix brut négatif
  - BT-148
  - erreur BR-28 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-28.xml
      invalid: examples/en16931/invalid/BR-28.xml
    fr:
      valid: examples/fr/fixed/BR-28.xml
      invalid: examples/fr/invalid/BR-28.xml
topic: lines
related:
- BR-27
- BR-FR-DEC-03
updated: '2026-11-23'
