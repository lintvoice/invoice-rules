id: BR-S-05
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category S, standard rate (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA S, taux normal (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-151
- BT-152
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:ApplicableTradeTax/ram:RateApplicablePercent
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:ClassifiedTaxCategory/cbc:Percent
official_message:
  lang: en
  text: In an Invoice line (BG-25) where the Invoiced item VAT category code (BT-151) is "Standard rated" the Invoiced item VAT rate (BT-152) shall be greater than zero.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-S-05
title:
  en: A standard-rated line must have a rate above zero
  fr: Une ligne au taux normal doit avoir un taux supérieur à zéro
brief:
  en: 'In the VAT category S (standard rate), the VAT rate of an invoice line is above zero: a 0% rate belongs to another category.'
  fr: 'Dans la catégorie de TVA S (taux normal), le taux de TVA d''une ligne est supérieur à zéro : un taux de 0 % relève d''une autre catégorie.'
search:
  en:
  - BR-S-05
  - VAT category S rate BT-152
  - Standard rated VAT rate
  - BT-152
  fr:
  - BR-S-05
  - taux de TVA catégorie S
  - BT-152
  - erreur BR-S-05 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-S-05.xml
      invalid: examples/en16931/invalid/BR-S-05.xml
    fr:
      valid: examples/fr/fixed/BR-S-05.xml
      invalid: examples/fr/invalid/BR-S-05.xml
topic: vat
related:
- BR-S-06
- BR-S-07
- BR-Z-05
updated: '2026-11-27'
