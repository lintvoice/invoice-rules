id: BR-DEC-09
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-106
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:LineTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:LineExtensionAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Sum of Invoice line net amount (BT-106) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-09
title:
  en: The total of the lines has more than 2 decimals
  fr: Le total des lignes HT a plus de 2 décimales
brief:
  en: The total of the lines must be written with at most 2 decimals, rounded to the cent.
  fr: Le total des lignes HT doit être écrit avec au plus 2 décimales, arrondi au centime.
search:
  en:
  - BR-DEC-09
  - the total of the lines more than 2 decimals
  - BT-106
  - LineTotalAmount decimals
  fr:
  - BR-DEC-09
  - le total des lignes HT plus de 2 décimales
  - BT-106
  - erreur BR-DEC-09 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-DEC-09.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-106.xml
topic: totals
related:
- BR-DEC-23
- BR-CO-10
- BR-FR-DEC-01
updated: '2026-11-23'
