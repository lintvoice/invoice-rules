id: BR-DEC-14
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-112
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:GrandTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Invoice total amount with VAT (BT-112) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-14
title:
  en: The total with VAT has more than 2 decimals
  fr: Le total TTC a plus de 2 décimales
brief:
  en: The total with VAT must be written with at most 2 decimals, rounded to the cent.
  fr: Le total TTC doit être écrit avec au plus 2 décimales, arrondi au centime.
search:
  en:
  - BR-DEC-14
  - the total with VAT more than 2 decimals
  - BT-112
  - GrandTotalAmount decimals
  fr:
  - BR-DEC-14
  - le total TTC plus de 2 décimales
  - BT-112
  - erreur BR-DEC-14 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-DEC-14.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01.xml
topic: totals
related:
- BR-DEC-12
- BR-DEC-13
- BR-CO-15
- BR-FR-DEC-01
updated: '2026-11-23'
