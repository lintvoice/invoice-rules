id: BR-05
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-5
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:InvoiceCurrencyCode
  ubl: /Invoice/cbc:DocumentCurrencyCode
official_message:
  lang: en
  text: An Invoice shall have an Invoice currency code (BT-5).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-05
title:
  en: The invoice currency is missing
  fr: La devise de la facture manque
brief:
  en: Every invoice must give its currency, with its three-letter code such as EUR.
  fr: Toute facture doit indiquer sa devise, avec son code à trois lettres comme EUR.
search:
  en:
  - BR-05
  - invoice currency code missing
  - BT-5 InvoiceCurrencyCode
  - error BR-05
  fr:
  - BR-05
  - devise de la facture manquante
  - BT-5 InvoiceCurrencyCode
  - erreur BR-05 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-05.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-05.xml
topic: invoice
related:
- BR-CL-04
- BR-CL-03
- BR-FR-CO-12
updated: '2026-11-23'
