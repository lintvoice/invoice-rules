id: BR-18
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-62
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTaxRepresentativeTradeParty/ram:Name
  ubl: /Invoice/cac:TaxRepresentativeParty/cac:PartyName/cbc:Name
official_message:
  lang: en
  text: The Seller tax representative name (BT-62) shall be provided in the Invoice, if the Seller (BG-4) has a Seller tax representative party (BG-11).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-18
title:
  en: The tax representative has no name
  fr: Le représentant fiscal n'a pas de nom
brief:
  en: When the seller has a tax representative, the invoice must give its name.
  fr: Quand le vendeur a un représentant fiscal, la facture doit en indiquer le nom.
search:
  en:
  - BR-18
  - seller tax representative name missing
  - BT-62
  - error BR-18
  fr:
  - BR-18
  - nom du représentant fiscal manquant
  - BT-62
  - erreur BR-18 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-18.xml
      invalid: examples/en16931/invalid/BR-18.xml
    fr:
      valid: examples/fr/fixed/BR-18.xml
      invalid: examples/fr/invalid/BR-18.xml
topic: parties
related:
- BR-19
- BR-20
- BR-56
updated: '2026-11-23'
