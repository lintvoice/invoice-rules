id: BR-O-07
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category O, outside the scope of VAT (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA O, hors du champ de la TVA (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-102
- BT-103
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:CategoryTradeTax/ram:RateApplicablePercent
  ubl: /Invoice/cac:AllowanceCharge/cac:TaxCategory/cbc:Percent
official_message:
  lang: en
  text: A Document level charge (BG-21) where the VAT category code (BT-102) is "Not subject to VAT" shall not contain a Document level charge VAT rate (BT-103).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-O-07
title:
  en: A charge outside the scope of VAT has no VAT rate
  fr: Des frais hors du champ de la TVA n'ont pas de taux de TVA
brief:
  en: A document level charge outside the scope of VAT (O) gives no VAT rate, not even 0%.
  fr: Des frais au niveau du document hors du champ de la TVA (O) n'indiquent aucun taux de TVA, pas même 0 %.
search:
  en:
  - BR-O-07
  - VAT category O rate BT-103
  - Not subject to VAT VAT rate
  - BT-103
  fr:
  - BR-O-07
  - taux de TVA catégorie O
  - BT-103
  - erreur BR-O-07 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-O-07.xml
      invalid: examples/en16931/invalid/BR-O-07.xml
topic: vat
related:
- BR-O-05
- BR-O-06
- BR-S-05
updated: '2026-11-27'
