id: BR-49
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-81
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementPaymentMeans/ram:TypeCode
  ubl: /Invoice/cac:PaymentMeans/cbc:PaymentMeansCode
official_message:
  lang: en
  text: A Payment instruction (BG-16) shall specify the Payment means type code (BT-81).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-49
title:
  en: The payment means is missing
  fr: Le moyen de paiement manque
brief:
  en: When an invoice gives payment instructions, it must say how to pay, with a standard code.
  fr: Quand une facture donne des instructions de paiement, elle doit dire comment payer, avec un code normalisé.
search:
  en:
  - BR-49
  - payment means type code missing
  - BT-81 PaymentMeansCode
  - error BR-49
  fr:
  - BR-49
  - moyen de paiement manquant
  - BT-81
  - erreur BR-49 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses a payment instruction without its payment means, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà une instruction de paiement sans son moyen de paiement, avant même cette règle. Nos exemples ne montrent que des erreurs
      que le format laisse passer.'
topic: payment
related:
- BR-CL-16
- BR-50
- BR-61
updated: '2026-11-23'
