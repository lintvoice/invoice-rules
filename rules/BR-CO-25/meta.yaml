id: BR-CO-25
rule_set:
  name: EXTENDED-CTC-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes: [CII, UBL]
  when:
    en: Invoices in the EXTENDED-CTC-FR profile (CII and UBL) and the Factur-X EXTENDED profile. The EN 16931 validation files no longer check it since their version 1.3.16.
    fr: Factures aux profils EXTENDED-CTC-FR (CII et UBL) et Factur-X EXTENDED. Les fichiers de validation EN 16931 ne la vérifient plus depuis leur version 1.3.16.
business_terms: [BT-115, BT-9, BT-20]
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradePaymentTerms
  ubl: /Invoice/cbc:DueDate
official_message:
  lang: en
  text: "In case the Amount due for payment (BT-115) is positive, either the Payment due date (BT-9) or the Payment terms (BT-20) shall be present."
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EXTENDED-CTC-FR/schematron/EXTENDED-CTC-FR-CII.sch
reported_ids: [BR-CO-25]
title:
  en: An amount due has neither a due date nor payment terms
  fr: Le net à payer n'a ni date d'échéance ni conditions de paiement
brief:
  en: "When an amount is due, give the payment due date, the payment terms, or both."
  fr: "Quand il reste un montant à payer, indiquez la date d'échéance, les conditions de paiement, ou les deux."
search:
  en: [BR-CO-25, amount due without payment due date or payment terms, BT-9 BT-20 BT-115, DueDateDateTime PaymentTerms]
  fr: [BR-CO-25, date d'échéance manquante facture électronique, BT-9 BT-20, erreur BR-CO-25 factur-x]
examples:
  source: invoice-examples
  version: 0.3.0
  target: fr
  valid: examples/fr/fixed/BR-CO-25.xml
  invalid: examples/fr/invalid/BR-CO-25.xml
related: [BR-CO-16, BR-FR-CO-09, BR-FR-05]
updated: 2026-11-17
