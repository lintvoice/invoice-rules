  - BR-13
  - total HT manquant
  - BT-109
  - erreur BR-13 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses an invoice without its total without vat, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà une facture sans le total HT, avant même cette règle. Nos exemples ne montrent que des erreurs que le format laisse passer.'
