    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-109
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:TaxBasisTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:TaxExclusiveAmount
official_message:
  lang: en
  text: An Invoice shall have the Invoice total amount without VAT (BT-109).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-13
title:
  en: The total without vat is missing
  fr: Le total HT manque
brief:
  en: Every invoice must give the total without vat.
  fr: Toute facture doit indiquer le total HT.
search:
  en:
  - BR-13
  - invoice total amount without VAT missing
  - BT-109 TaxBasisTotalAmount
  - error BR-13
