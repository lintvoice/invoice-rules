id: BR-29
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-73
- BT-74
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:BillingSpecifiedPeriod
  ubl: /Invoice/cac:InvoicePeriod
official_message:
  lang: en
  text: If both Invoicing period start date (BT-73) and Invoicing period end date (BT-74) are given then the Invoicing period end date (BT-74) shall be later or equal to the Invoicing period start date
    (BT-73).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-29
title:
  en: The invoicing period ends before it starts
  fr: La période de facturation finit avant de commencer
brief:
  en: When the invoicing period gives both dates, the end date must not be before the start date.
  fr: Quand la période de facturation indique ses deux dates, la date de fin ne doit pas précéder la date de début.
search:
  en:
  - BR-29
  - invoicing period end date before start date
  - BT-73 BT-74
  - error BR-29
  fr:
  - BR-29
  - période de facturation dates inversées
  - BT-73 BT-74
  - erreur BR-29 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-29.xml
      invalid: examples/en16931/invalid/BR-29.xml
    fr:
      valid: examples/fr/fixed/BR-29.xml
      invalid: examples/fr/invalid/BR-29.xml
topic: invoice
related:
- BR-30
- BR-CO-19
updated: '2026-11-23'
