id: BR-DEC-23
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-131
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:SpecifiedTradeSettlementLineMonetarySummation/ram:LineTotalAmount
  ubl: /Invoice/cac:InvoiceLine/cbc:LineExtensionAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Invoice line net amount (BT-131) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-23
title:
  en: A line's net amount has more than 2 decimals
  fr: Le montant net d'une ligne a plus de 2 décimales
brief:
  en: A line's net amount must be written with at most 2 decimals, rounded to the cent.
  fr: Le montant net d'une ligne doit être écrit avec au plus 2 décimales, arrondi au centime.
search:
  en:
  - BR-DEC-23
  - a line's net amount more than 2 decimals
  - BT-131
  - LineTotalAmount decimals
  fr:
  - BR-DEC-23
  - le montant net d'une ligne plus de 2 décimales
  - BT-131
  - erreur BR-DEC-23 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-DEC-23.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-131.xml
topic: lines
related:
- BR-DEC-09
- BR-CO-10
- BR-FR-DEC-01
updated: '2026-11-23'
