id: BR-CO-13
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-109
- BT-106
- BT-107
- BT-108
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:TaxBasisTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:TaxExclusiveAmount
official_message:
  lang: en
  text: Invoice total amount without VAT (BT-109) = Σ Invoice line net amount (BT-131) - Sum of allowances on document level (BT-107) + Sum of charges on document level (BT-108).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-13
title:
  en: The total without VAT is not the lines minus allowances plus charges
  fr: Le total HT n'est pas égal aux lignes, moins les remises, plus les frais
brief:
  en: The total without VAT must be exactly the sum of the lines, minus the invoice's allowances, plus its charges, to the cent.
  fr: Le total HT doit être exactement le total des lignes, moins les remises et plus les frais de la facture, au centime près.
search:
  en:
  - BR-CO-13
  - invoice total amount without VAT mismatch
  - BT-109 BT-106 BT-107 BT-108
  - TaxBasisTotalAmount
  - TaxExclusiveAmount
  fr:
  - BR-CO-13
  - total HT incohérent facture électronique
  - BT-109
  - erreur BR-CO-13 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-CO-13.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CO-13.xml
topic: totals
related:
- BR-CO-10
- BR-CO-11
- BR-CO-12
- BR-CO-15
updated: '2026-11-16'
