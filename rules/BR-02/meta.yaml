- BT-1
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:ExchangedDocument/ram:ID
  ubl: /Invoice/cbc:ID
official_message:
  lang: en
  text: An Invoice shall have an Invoice number (BT-1).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-02
title:
  en: The invoice number is missing
  fr: Le numéro de facture manque
brief:
  en: Every invoice must have a number.
  fr: Toute facture doit avoir un numéro.
search:
  en:
  - BR-02
  - invoice number missing
  - BT-1 invoice number
  - error BR-02
  fr:
  - BR-02
  - numéro de facture manquant
  - BT-1 numéro de facture
  - erreur BR-02 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-02.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-02.xml
topic: invoice
related:
