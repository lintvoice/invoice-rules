id: BR-43
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-141
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:ActualAmount
  ubl: /Invoice/cac:InvoiceLine/cac:AllowanceCharge/cbc:Amount
official_message:
  lang: en
  text: Each Invoice line charge (BG-28) shall have an Invoice line charge amount (BT-141).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-43
title:
  en: A line charge has no amount
  fr: Des frais sur ligne n'ont pas de montant
brief:
  en: Each line charge must give its amount.
  fr: Des frais sur ligne doivent toujours indiquer leur montant.
search:
  en:
  - BR-43
  - invoice line charge amount missing
  - BT-141
  - error BR-43
  fr:
  - BR-43
  - montant de frais sur ligne manquant
  - BT-141
  - erreur BR-43 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses a line charge without its amount, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà des frais sur ligne sans leur montant, avant même cette règle. Nos exemples ne montrent que des erreurs que le format
      laisse passer.'
topic: lines
related:
- BR-44
- BR-41
updated: '2026-11-23'
