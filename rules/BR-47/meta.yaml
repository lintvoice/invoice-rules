id: BR-47
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-118
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:CategoryCode
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:ID
official_message:
  lang: en
  text: Each VAT breakdown (BG-23) shall be defined through a VAT category code (BT-118).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-47
title:
  en: A VAT rate has no VAT category
  fr: Un taux de TVA n'a pas de catégorie
brief:
  en: 'Each VAT breakdown must give its VAT category: standard rate, exempt, reverse charge…'
  fr: 'Chaque ventilation de TVA doit indiquer sa catégorie de TVA : taux normal, exonération, autoliquidation…'
search:
  en:
  - BR-47
  - VAT category code missing
  - BT-118 CategoryCode
  - error BR-47
  fr:
  - BR-47
  - catégorie de TVA manquante
  - BT-118
  - erreur BR-47 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses a VAT breakdown without its category, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà une ventilation de TVA sans sa catégorie, avant même cette règle. Nos exemples ne montrent que des erreurs que le format
      laisse passer.'
topic: vat
related:
- BR-CL-18
- BR-CO-18
- BR-48
updated: '2026-11-23'
