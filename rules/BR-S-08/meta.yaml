id: BR-S-08
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 whose VAT breakdown has the category S, for any VAT rate above zero (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 dont la ventilation de TVA a la catégorie S, celle de tout taux supérieur à zéro (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme
      française et allemande).
business_terms:
- BT-116
- BT-131
- BT-92
- BT-99
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:BasisAmount
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxableAmount
official_message:
  lang: en
  text: For each different value of VAT category rate (BT-119) where the VAT category code (BT-118) is "Standard rated", the VAT category taxable amount (BT-116) in a VAT breakdown (BG-23) shall equal the
    sum of Invoice line net amounts (BT-131) plus the sum of document level charge amounts (BT-99) minus the sum of document level allowance amounts (BT-92) where the VAT category code (BT-151, BT-102,
    BT-95) is "Standard rated" and the VAT rate (BT-152, BT-103, BT-96) equals the VAT category rate (BT-119).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-S-08
title:
  fr: La base HT d'un taux n'est pas la somme de ses lignes
  en: A rate's taxable amount is not the sum of its lines
brief:
  fr: Pour chaque taux, la base HT doit être la somme des lignes à ce taux, plus les frais et moins les remises au même taux.
  en: For each rate, the taxable amount must be the sum of the lines at that rate, plus the charges and minus the allowances at the same rate.
search:
  en:
  - BR-S-08
  - VAT category taxable amount wrong
  - BT-116 BT-131
  - TaxableAmount BasisAmount
  fr:
  - BR-S-08
  - base HT par taux incohérente facture électronique
  - BT-116
  - erreur BR-S-08 factur-x
examples:
  source: invoice-examples
  version: 0.4.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-S-08.xml
topic: vat
related:
- BR-CO-17
- BR-S-09
- BR-CO-13
updated: '2026-11-18'
