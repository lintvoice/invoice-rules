id: BR-31
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-92
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:ActualAmount
  ubl: /Invoice/cac:AllowanceCharge/cbc:Amount
official_message:
  lang: en
  text: Each Document level allowance (BG-20) shall have a Document level allowance amount (BT-92).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-31
title:
  en: An allowance on the whole invoice has no amount
  fr: Une remise globale n'a pas de montant
brief:
  en: Each allowance on the whole invoice must give its amount.
  fr: Chaque remise globale doit indiquer son montant.
search:
  en:
  - BR-31
  - document level allowance amount missing
  - BT-92
  - error BR-31
  fr:
  - BR-31
  - montant de remise globale manquant
  - BT-92
  - erreur BR-31 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses an allowance on the whole invoice without its amount, before this rule runs. Our examples only show mistakes the format lets
      through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà une remise globale sans son montant, avant même cette règle. Nos exemples ne montrent que des erreurs que le format laisse
      passer.'
topic: lines
related:
- BR-32
- BR-33
- BR-CO-11
updated: '2026-11-23'
