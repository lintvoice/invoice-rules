id: BR-37
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-102
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:CategoryTradeTax/ram:CategoryCode
  ubl: /Invoice/cac:AllowanceCharge/cac:TaxCategory/cbc:ID
official_message:
  lang: en
  text: Each Document level charge (BG-21) shall have a Document level charge VAT category code (BT-102).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-37
title:
  en: A charge on the whole invoice has no VAT category
  fr: Des frais globaux n'ont pas de catégorie de TVA
brief:
  en: Each charge on the whole invoice must give its VAT category, so that the VAT breakdown can take it into account.
  fr: Les frais globaux doivent indiquer leur catégorie de TVA, pour que la ventilation de TVA en tienne compte.
search:
  en:
  - BR-37
  - document level charge VAT category code missing
  - BT-102
  - error BR-37
  fr:
  - BR-37
  - catégorie de TVA de frais globaux manquante
  - BT-102
  - erreur BR-37 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-37.xml
      invalid: examples/en16931/invalid/BR-37.xml
    fr:
      valid: examples/fr/fixed/BR-37.xml
      invalid: examples/fr/invalid/BR-37.xml
topic: vat
related:
- BR-36
- BR-38
- BR-S-08
- BR-CL-17
updated: '2026-11-23'
