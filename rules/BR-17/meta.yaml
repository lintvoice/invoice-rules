id: BR-17
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-59
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:PayeeTradeParty/ram:Name
  ubl: /Invoice/cac:PayeeParty/cac:PartyName/cbc:Name
official_message:
  lang: en
  text: The Payee name (BT-59) shall be provided in the Invoice, if the Payee (BG-10) is different from the Seller (BG-4).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-17
title:
  en: The payee has no name, or is the seller itself
  fr: Le bénéficiaire n'a pas de nom, ou c'est le vendeur lui-même
brief:
  en: When an invoice names a payee, someone other than the seller who receives the payment, it must give its name, and the payee must not be the seller.
  fr: Quand une facture indique un bénéficiaire du paiement, quelqu'un d'autre que le vendeur qui reçoit le paiement, elle doit en donner le nom, et ce bénéficiaire ne doit pas être le vendeur.
search:
  en:
  - BR-17
  - payee name missing
  - BT-59 payee different from seller
  - error BR-17
  fr:
  - BR-17
  - nom du bénéficiaire manquant
  - BT-59 bénéficiaire différent du vendeur
  - erreur BR-17 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-17.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-17.xml
topic: parties
related:
- BR-FR-CO-10
- BR-06
updated: '2026-11-23'
