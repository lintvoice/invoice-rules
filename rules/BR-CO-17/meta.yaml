id: BR-CO-17
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-117
- BT-116
- BT-119
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:CalculatedAmount
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxAmount
official_message:
  lang: en
  text: VAT category tax amount (BT-117) = VAT category taxable amount (BT-116) x (VAT category rate (BT-119) / 100), rounded to two decimals.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-17
title:
  fr: La TVA d'un taux n'est pas sa base multipliée par le taux
  en: A rate's VAT is not its taxable amount times the rate
brief:
  fr: Pour chaque taux, le montant de TVA doit être la base HT multipliée par le taux, arrondie au centime.
  en: For each rate, the VAT amount must be the taxable amount times the rate, rounded to the cent.
search:
  en:
  - BR-CO-17
  - VAT category tax amount wrong
  - BT-117 BT-116 BT-119
  - CalculatedAmount BasisAmount
  fr:
  - BR-CO-17
  - montant de TVA par taux incohérent facture électronique
  - BT-117 BT-116
  - erreur BR-CO-17 factur-x
examples:
  source: invoice-examples
  version: 0.3.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-CO-17.xml
related:
- BR-CO-14
- BR-S-09
updated: '2026-11-17'
