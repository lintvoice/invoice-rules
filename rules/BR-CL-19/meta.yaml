id: BR-CL-19
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-98
- BT-140
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:ReasonCode
  ubl: /Invoice/cac:AllowanceCharge/cbc:AllowanceChargeReasonCode
official_message:
  lang: en
  text: Coded allowance reasons MUST belong to the UNCL 5189 code list
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-19
title:
  en: An allowance's reason is not a valid code
  fr: Le motif d'une remise n'est pas un code valide
brief:
  en: When an allowance gives its reason as a code, the code must come from the official list for allowances, such as 95 for a discount.
  fr: Quand une remise indique son motif par un code, ce code doit venir de la liste officielle des remises, comme 95 pour une remise.
search:
  en:
  - BR-CL-19
  - allowance reason code not valid
  - BT-98 UNCL 5189
  - error BR-CL-19
  fr:
  - BR-CL-19
  - code motif remise invalide
  - BT-98 UNCL 5189
  - erreur BR-CL-19 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-19.xml
      invalid: examples/en16931/invalid/BR-CL-19.xml
    fr:
      valid: examples/fr/fixed/BR-CL-19.xml
      invalid: examples/fr/invalid/BR-CL-19.xml
topic: lines
related:
- BR-CL-20
- BR-33
- BR-CO-21
updated: '2026-11-23'
