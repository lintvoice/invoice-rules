id: BR-CL-21
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-157
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedTradeProduct/ram:GlobalID/@schemeID
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:StandardItemIdentification/cbc:ID/@schemeID
official_message:
  lang: en
  text: Item standard identifier scheme identifier MUST belong to the ISO 6523 ICD code list
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-21
title:
  en: An item identifier's kind is not a valid code
  fr: Le type de l'identifiant d'un article n'est pas un code valide
brief:
  en: The code that says what kind of standard identifier an item has must be in the ISO 6523 list, such as 0160 for a GTIN.
  fr: Le code qui dit de quel type est l'identifiant standard d'un article doit être dans la liste ISO 6523, comme 0160 pour un GTIN.
search:
  en:
  - BR-CL-21
  - item standard identifier scheme not valid
  - BT-157 GTIN 0160
  - error BR-CL-21
  fr:
  - BR-CL-21
  - schéma identifiant article invalide
  - BT-157 GTIN 0160
  - erreur BR-CL-21 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-21.xml
      invalid: examples/en16931/invalid/BR-CL-21.xml
    fr:
      valid: examples/fr/fixed/BR-CL-21.xml
      invalid: examples/fr/invalid/BR-CL-21.xml
topic: lines
related:
- BR-64
- BR-CL-10
updated: '2026-11-23'
