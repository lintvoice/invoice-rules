id: BR-53
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-6
- BT-111
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:TaxTotalAmount
  ubl: /Invoice/cac:TaxTotal/cbc:TaxAmount
official_message:
  lang: en
  text: If the VAT accounting currency code (BT-6) is present, then the Invoice total VAT amount in accounting currency (BT-111) shall be provided.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-53
title:
  en: The VAT total in the VAT accounting currency is missing
  fr: Le total de TVA dans la devise de comptabilisation manque
brief:
  en: When the invoice names a VAT accounting currency, another one than its own, it must give its VAT total in that currency.
  fr: Quand la facture indique une devise de comptabilisation de la TVA, autre que sa propre devise, elle doit donner son total de TVA dans cette devise.
search:
  en:
  - BR-53
  - VAT total in accounting currency missing
  - BT-6 BT-111 TaxCurrencyCode
  - error BR-53
  fr:
  - BR-53
  - total de TVA en devise de comptabilisation manquant
  - BT-6 BT-111
  - erreur BR-53 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-53.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-53.xml
topic: vat
related:
- BR-DEC-15
- BR-CL-05
- BR-FR-CO-12
updated: '2026-11-23'
