id: BR-36
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-99
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:ActualAmount
  ubl: /Invoice/cac:AllowanceCharge/cbc:Amount
official_message:
  lang: en
  text: Each Document level charge (BG-21) shall have a Document level charge amount (BT-99).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-36
title:
  en: A charge on the whole invoice has no amount
  fr: Des frais globaux n'ont pas de montant
brief:
  en: Each charge on the whole invoice must give its amount.
  fr: Des frais globaux doivent toujours indiquer leur montant.
search:
  en:
  - BR-36
  - document level charge amount missing
  - BT-99
  - error BR-36
  fr:
  - BR-36
  - montant de frais globaux manquant
  - BT-99
  - erreur BR-36 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets: {}
  none:
    en: 'No example invoice for this rule: the Factur-X format already refuses a charge on the whole invoice without its amount, before this rule runs. Our examples only show mistakes the format lets through.'
    fr: 'Pas de facture d''exemple pour cette règle : le format Factur-X refuse déjà des frais globaux sans leur montant, avant même cette règle. Nos exemples ne montrent que des erreurs que le format laisse
      passer.'
topic: lines
related:
- BR-37
- BR-38
- BR-CO-12
updated: '2026-11-23'
