id: BR-DEC-19
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-116
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:BasisAmount
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxableAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the VAT category taxable amount (BT-116) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-19
title:
  en: A rate's taxable amount has more than 2 decimals
  fr: La base HT d'un taux a plus de 2 décimales
brief:
  en: A rate's taxable amount must be written with at most 2 decimals, rounded to the cent.
  fr: La base HT d'un taux doit être écrite avec au plus 2 décimales, arrondie au centime.
search:
  en:
  - BR-DEC-19
  - a rate's taxable amount more than 2 decimals
  - BT-116
  - BasisAmount decimals
  fr:
  - BR-DEC-19
  - la base HT d'un taux plus de 2 décimales
  - BT-116
  - erreur BR-DEC-19 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-DEC-19.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-116.xml
topic: vat
related:
- BR-DEC-20
- BR-S-08
- BR-FR-DEC-01
updated: '2026-11-23'
