id: BR-CL-07
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-18
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:AdditionalReferencedDocument/ram:ReferenceTypeCode
  ubl: /Invoice/cac:AdditionalDocumentReference/cbc:ID/@schemeID
official_message:
  lang: en
  text: Object identifier identification scheme identifier MUST be coded using a restriction of UNTDID 1153.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-07
title:
  en: The kind of invoiced object is not a valid code
  fr: Le type d'objet facturé n'est pas un code valide
brief:
  en: When an invoice identifies the object it invoices, the code that says what kind of identifier it is must come from the official list.
  fr: Quand une facture identifie l'objet qu'elle facture, le code qui dit de quel type d'identifiant il s'agit doit venir de la liste officielle.
search:
  en:
  - BR-CL-07
  - invoiced object identifier scheme not valid
  - BT-18 UNTDID 1153
  - error BR-CL-07
  fr:
  - BR-CL-07
  - schéma objet facturé invalide
  - BT-18 UNTDID 1153
  - erreur BR-CL-07 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-07.xml
      invalid: examples/en16931/invalid/BR-CL-07.xml
    fr:
      valid: examples/fr/fixed/BR-CL-07.xml
      invalid: examples/fr/invalid/BR-CL-07.xml
topic: lines
related:
- BR-FR-29
- BR-52
updated: '2026-11-23'
