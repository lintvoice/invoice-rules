id: BR-CL-20
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-105
- BT-145
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:ReasonCode
  ubl: /Invoice/cac:AllowanceCharge/cbc:AllowanceChargeReasonCode
official_message:
  lang: en
  text: Coded charge reasons MUST belong to the UNCL 7161 code list
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-20
title:
  en: A charge's reason is not a valid code
  fr: Le motif de frais n'est pas un code valide
brief:
  en: When a charge gives its reason as a code, the code must come from the official list for charges, such as FC for freight.
  fr: Quand des frais indiquent leur motif par un code, ce code doit venir de la liste officielle des frais, comme FC pour le transport.
search:
  en:
  - BR-CL-20
  - charge reason code not valid
  - BT-105 UNCL 7161
  - error BR-CL-20
  fr:
  - BR-CL-20
  - code motif frais invalide
  - BT-105 UNCL 7161
  - erreur BR-CL-20 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CL-20.xml
      invalid: examples/en16931/invalid/BR-CL-20.xml
    fr:
      valid: examples/fr/fixed/BR-CL-20.xml
      invalid: examples/fr/invalid/BR-CL-20.xml
topic: lines
related:
- BR-CL-19
- BR-38
- BR-CO-22
updated: '2026-11-23'
