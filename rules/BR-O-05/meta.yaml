id: BR-O-05
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category O, outside the scope of VAT (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA O, hors du champ de la TVA (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-151
- BT-152
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:ApplicableTradeTax/ram:RateApplicablePercent
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:ClassifiedTaxCategory/cbc:Percent
official_message:
  lang: en
  text: An Invoice line (BG-25) where the VAT category code (BT-151) is "Not subject to VAT" shall not contain an Invoiced item VAT rate (BT-152).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-O-05
title:
  en: A line outside the scope of VAT has no VAT rate
  fr: Une ligne hors du champ de la TVA n'a pas de taux de TVA
brief:
  en: An invoice line outside the scope of VAT (O) gives no VAT rate, not even 0 %.
  fr: Une ligne hors du champ de la TVA (O) n'indique aucun taux de TVA, pas même 0 %.
search:
  en:
  - BR-O-05
  - VAT category O rate BT-152
  - Not subject to VAT VAT rate
  - BT-152
  fr:
  - BR-O-05
  - taux de TVA catégorie O
  - BT-152
  - erreur BR-O-05 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-O-05.xml
      invalid: examples/en16931/invalid/BR-O-05.xml
topic: vat
related:
- BR-O-06
- BR-O-07
- BR-S-05
updated: '2026-11-24'
