id: BR-23
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-130
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeDelivery/ram:BilledQuantity/@unitCode
  ubl: /Invoice/cac:InvoiceLine/cbc:InvoicedQuantity/@unitCode
official_message:
  lang: en
  text: An Invoice line (BG-25) shall have an Invoiced quantity unit of measure code (BT-130).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-23
title:
  fr: La quantité d'une ligne n'a pas d'unité
  en: A line's quantity has no unit
brief:
  fr: Chaque quantité facturée doit indiquer son unité de mesure (unité, heure, jour…), sous forme de code normalisé.
  en: Each invoiced quantity must give its unit of measure (unit, hour, day…), as a standard code.
search:
  en:
  - BR-23
  - unit of measure code missing
  - BT-130 unitCode
  - C62 unit code
  fr:
  - BR-23
  - unité de mesure manquante facture électronique
  - BT-130 unitCode
  - erreur BR-23 factur-x
examples:
  source: invoice-examples
  version: 0.4.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-23.xml
topic: lines
related:
- BR-22
updated: '2026-11-18'
