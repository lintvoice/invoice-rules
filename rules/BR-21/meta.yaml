id: BR-21
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-126
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:AssociatedDocumentLineDocument/ram:LineID
  ubl: /Invoice/cac:InvoiceLine/cbc:ID
official_message:
  lang: en
  text: Each Invoice line (BG-25) shall have an Invoice line identifier (BT-126).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-21
title:
  en: A line has no line number
  fr: Une ligne n'a pas de numéro
brief:
  en: Each invoice line must have its identifier, a line number for example.
  fr: Chaque ligne de facture doit avoir son identifiant, un numéro de ligne par exemple.
search:
  en:
  - BR-21
  - invoice line identifier missing
  - BT-126 LineID
  - error BR-21
  fr:
  - BR-21
  - identifiant de ligne manquant
  - BT-126 LineID
  - erreur BR-21 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-21.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-21.xml
topic: lines
related:
- BR-25
- BR-16
updated: '2026-11-23'
