id: BR-E-10
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 whose VAT breakdown has the category E, exempt from VAT (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 dont la ventilation de TVA a la catégorie E, exonérée de TVA (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-120
- BT-121
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:ExemptionReason
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:TaxExemptionReason
official_message:
  lang: en
  text: A VAT Breakdown (BG-23) with VAT Category code (BT-118) "Exempt from VAT" shall have a VAT exemption reason code (BT-121) or a VAT exemption reason text (BT-120).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-E-10
title:
  fr: L'exonération de TVA n'a pas de motif
  en: A VAT exemption gives no reason
brief:
  fr: Quand une partie de la facture est exonérée de TVA, la ventilation de TVA doit en donner le motif, en texte ou sous forme de code.
  en: When part of the invoice is exempt from VAT, its VAT breakdown must give the reason, as text or as a code.
search:
  en:
  - BR-E-10
  - VAT exemption reason missing
  - BT-120 BT-121
  - VATEX exemption reason code
  fr:
  - BR-E-10
  - motif d'exonération de TVA manquant facture électronique
  - BT-120 BT-121 VATEX
  - erreur BR-E-10 factur-x
examples:
  source: invoice-examples
  version: 0.4.0
  target: fr
  valid: examples/fr/fixed/BR-E-10.xml
  invalid: examples/fr/invalid/BR-E-10.xml
topic: vat
related:
- BR-S-02
- BR-CO-18
updated: '2026-11-18'
