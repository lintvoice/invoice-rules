id: BR-FR-DEC-03
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-23
- BT-146
- BT-147
- BT-148
paths:
  cii: rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeAgreement/ram:NetPriceProductTradePrice/ram:ChargeAmount
  ubl: ubl:Invoice/cac:InvoiceLine | cn:CreditNote/cac:CreditNoteLine
official_message:
  lang: fr
  text: 'Le montant « […] » est invalide. Il doit : - être un nombre strictement positif (sans signe « - »), sauf si Cadre de Facturation (BT-23) est S9, M9 ou B9 (bi-directionnel) - comporter au plus 6
    décimales (séparateur « . »), - contenir au maximum 19 caractères (hors séparateur).'
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-DEC-03_BT-146
- BR-FR-DEC-03_BT-147
- BR-FR-DEC-03_BT-148
title:
  en: A unit price has more than 6 decimals or is negative
  fr: Un prix unitaire a plus de 6 décimales ou est négatif
brief:
  en: Unit prices must have at most 6 decimals and no minus sign, except with the billing framework B9, S9 or M9.
  fr: Les prix unitaires doivent avoir au plus 6 décimales et pas de signe moins, sauf avec le cadre de facturation B9, S9 ou M9.
search:
  en:
  - BR-FR-DEC-03
  - unit price more than 6 decimals
  - negative unit price invoice
  fr:
  - BR-FR-DEC-03
  - prix unitaire 6 décimales
  - prix unitaire négatif facture
  - erreur BR-FR-DEC-03
examples:
  source: invoice-examples
  version: 0.1.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-FR-DEC-03.xml
related:
- BR-FR-DEC-01
- BR-FR-DEC-02
- BR-FR-DEC-04
updated: '2026-11-16'
