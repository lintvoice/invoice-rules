id: BR-FR-18
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-123
paths:
  cii: ''
  ubl: ''
official_message:
  lang: fr
  text: Il ne peut y avoir **qu’un seul** document additionnel (BG-24) dont la description (BT-123) est "LISIBLE".
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-18_BT-123
title:
  en: More than one attachment is described as LISIBLE
  fr: Plus d'une pièce jointe est décrite LISIBLE
brief:
  en: An invoice may have only one attachment described as LISIBLE, its readable version.
  fr: Une facture ne peut avoir qu'une seule pièce jointe décrite LISIBLE, sa version lisible.
search:
  en:
  - BR-FR-18
  - LISIBLE attachment twice
  - readable version attachment e-invoice
  fr:
  - BR-FR-18
  - pièce jointe LISIBLE en double
  - version lisible facture électronique
  - erreur BR-FR-18
examples:
  source: invoice-examples
  version: 0.2.0
  targets:
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-18.xml
topic: attachments
related:
- BR-FR-17
updated: '2026-11-16'
