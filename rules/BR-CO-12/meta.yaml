id: BR-CO-12
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-108
- BT-99
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:ChargeTotalAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:ChargeTotalAmount
official_message:
  lang: en
  text: Sum of charges on document level (BT-108) = Σ Document level charge amount (BT-99).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-12
title:
  en: The charge total is not the sum of the charges
  fr: Le total des frais n'est pas la somme des frais
brief:
  en: The charge total must be exactly the sum of the charges on the whole invoice, to the cent.
  fr: Le total des frais doit être exactement la somme des frais ajoutés à l'ensemble de la facture, au centime près.
search:
  en:
  - BR-CO-12
  - sum of charges on document level mismatch
  - BT-108 BT-99
  - ChargeTotalAmount
  fr:
  - BR-CO-12
  - total des frais incohérent facture électronique
  - BT-108 BT-99
  - erreur BR-CO-12 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-CO-12.xml
      invalid: examples/en16931/invalid/BR-CO-12.xml
    fr:
      valid: examples/fr/fixed/BR-CO-12.xml
      invalid: examples/fr/invalid/BR-CO-12.xml
topic: totals
related:
- BR-CO-11
- BR-CO-13
- BR-CO-22
updated: '2026-11-16'
