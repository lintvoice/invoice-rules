id: BR-62
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-34
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:URIUniversalCommunication/ram:URIID/@schemeID
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party/cbc:EndpointID/@schemeID
official_message:
  lang: en
  text: The Seller electronic address (BT-34) shall have a Scheme identifier.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-62
title:
  en: The seller's electronic address does not say what kind of address it is
  fr: L'adresse électronique du vendeur ne dit pas de quel type d'adresse il s'agit
brief:
  en: The seller's electronic address must say, with a standard code, what kind of address it is.
  fr: L'adresse électronique du vendeur doit dire, avec un code normalisé, de quel type d'adresse il s'agit.
search:
  en:
  - BR-62
  - seller electronic address scheme identifier missing
  - BT-34 schemeID
  - error BR-62
  fr:
  - BR-62
  - adresse électronique du vendeur sans schéma
  - BT-34 schemeID
  - erreur BR-62 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-62.xml
      invalid: examples/en16931/invalid/BR-62.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-62.xml
topic: addresses
related:
- BR-63
- BR-CL-25
- BR-FR-21
updated: '2026-11-23'
