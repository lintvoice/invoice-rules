id: BR-45
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-116
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax/ram:BasisAmount
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxableAmount
official_message:
  lang: en
  text: Each VAT breakdown (BG-23) shall have a VAT category taxable amount (BT-116).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-45
title:
  en: A VAT rate has no taxable amount
  fr: Un taux de TVA n'a pas de base
brief:
  en: Each VAT breakdown must give its taxable amount, the total without VAT of what is invoiced in its category and at its rate.
  fr: Chaque ventilation de TVA doit indiquer sa base, le total hors TVA de ce qui est facturé dans sa catégorie et à son taux.
search:
  en:
  - BR-45
  - VAT category taxable amount missing
  - BT-116 BasisAmount
  - error BR-45
  fr:
  - BR-45
  - base de TVA manquante
  - BT-116
  - erreur BR-45 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-45.xml
      invalid: examples/en16931/invalid/BR-45.xml
    fr:
      valid: examples/fr/fixed/BR-45.xml
      invalid: examples/fr/invalid/BR-45.xml
topic: vat
related:
- BR-46
- BR-S-08
updated: '2026-11-23'
