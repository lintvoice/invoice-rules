id: BR-63
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-49
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:BuyerTradeParty/ram:URIUniversalCommunication/ram:URIID/@schemeID
  ubl: /Invoice/cac:AccountingCustomerParty/cac:Party/cbc:EndpointID/@schemeID
official_message:
  lang: en
  text: The Buyer electronic address (BT-49) shall have a Scheme identifier.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-63
title:
  en: The buyer's electronic address does not say what kind of address it is
  fr: L'adresse électronique de l'acheteur ne dit pas de quel type d'adresse il s'agit
brief:
  en: The buyer's electronic address must say, with a standard code, what kind of address it is.
  fr: L'adresse électronique de l'acheteur doit dire, avec un code normalisé, de quel type d'adresse il s'agit.
search:
  en:
  - BR-63
  - buyer electronic address scheme identifier missing
  - BT-49 schemeID
  - error BR-63
  fr:
  - BR-63
  - adresse électronique de l'acheteur sans schéma
  - BT-49 schemeID
  - erreur BR-63 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-63.xml
      invalid: examples/en16931/invalid/BR-63.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-63.xml
topic: addresses
related:
- BR-62
- BR-CL-25
- BR-FR-22
updated: '2026-11-23'
