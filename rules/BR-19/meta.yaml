id: BR-19
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms: []
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTaxRepresentativeTradeParty/ram:PostalTradeAddress
  ubl: /Invoice/cac:TaxRepresentativeParty/cac:PostalAddress
official_message:
  lang: en
  text: The Seller tax representative postal address (BG-12) shall be provided in the Invoice, if the Seller (BG-4) has a Seller tax representative party (BG-11).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-19
title:
  en: The tax representative has no postal address
  fr: Le représentant fiscal n'a pas d'adresse postale
brief:
  en: When the seller has a tax representative, the invoice must give its postal address.
  fr: Quand le vendeur a un représentant fiscal, la facture doit en indiquer l'adresse postale.
search:
  en:
  - BR-19
  - seller tax representative postal address missing
  - BG-12
  - error BR-19
  fr:
  - BR-19
  - adresse du représentant fiscal manquante
  - BG-12
  - erreur BR-19 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-19.xml
      invalid: examples/en16931/invalid/BR-19.xml
    fr:
      valid: examples/fr/fixed/BR-19.xml
      invalid: examples/fr/invalid/BR-19.xml
topic: parties
related:
- BR-18
- BR-20
- BR-56
updated: '2026-11-23'
