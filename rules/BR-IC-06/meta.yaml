id: BR-IC-06
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category K, intra-Community supply (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA K, livraison intracommunautaire (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-95
- BT-96
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:CategoryTradeTax/ram:RateApplicablePercent
  ubl: /Invoice/cac:AllowanceCharge/cac:TaxCategory/cbc:Percent
official_message:
  lang: en
  text: In a Document level allowance (BG-20) where the Document level allowance VAT category code (BT-95) is "Intra-community supply" the Document level allowance VAT rate (BT-96) shall be 0 (zero).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-IC-06
title:
  en: An allowance on an intra-Community supply must have a 0 % rate
  fr: Une remise sur une livraison intracommunautaire doit avoir un taux de 0 %
brief:
  en: In the VAT category K (intra-Community supply), the VAT rate of a document level allowance is 0 %.
  fr: Dans la catégorie de TVA K (livraison intracommunautaire), le taux de TVA d'une remise au niveau du document est de 0 %.
search:
  en:
  - BR-IC-06
  - VAT category K rate BT-96
  - Intra-community supply VAT rate
  - BT-96
  fr:
  - BR-IC-06
  - taux de TVA catégorie K
  - BT-96
  - erreur BR-IC-06 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-IC-06.xml
      invalid: examples/en16931/invalid/BR-IC-06.xml
    fr:
      valid: examples/fr/fixed/BR-IC-06.xml
      invalid: examples/fr/invalid/BR-IC-06.xml
topic: vat
related:
- BR-IC-05
- BR-IC-07
- BR-S-05
updated: '2026-11-24'
