id: BR-S-07
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category S, standard rate (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA S, taux normal (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-102
- BT-103
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:CategoryTradeTax/ram:RateApplicablePercent
  ubl: /Invoice/cac:AllowanceCharge/cac:TaxCategory/cbc:Percent
official_message:
  lang: en
  text: In a Document level charge (BG-21) where the Document level charge VAT category code (BT-102) is "Standard rated" the Document level charge VAT rate (BT-103) shall be greater than zero.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-S-07
title:
  en: A standard-rated charge must have a rate above zero
  fr: Des frais au taux normal doivent avoir un taux supérieur à zéro
brief:
  en: 'In the VAT category S (standard rate), the VAT rate of a document level charge is above zero: a 0 % rate belongs to another category.'
  fr: 'Dans la catégorie de TVA S (taux normal), le taux de TVA des frais au niveau du document est supérieur à zéro : un taux de 0 % relève d''une autre catégorie.'
search:
  en:
  - BR-S-07
  - VAT category S rate BT-103
  - Standard rated VAT rate
  - BT-103
  fr:
  - BR-S-07
  - taux de TVA catégorie S
  - BT-103
  - erreur BR-S-07 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-S-07.xml
      invalid: examples/en16931/invalid/BR-S-07.xml
    fr:
      valid: examples/fr/fixed/BR-S-07.xml
      invalid: examples/fr/invalid/BR-S-07.xml
topic: vat
related:
- BR-S-05
- BR-S-06
- BR-Z-05
updated: '2026-11-24'
