id: BR-CO-23
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-139
- BT-140
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:SpecifiedTradeAllowanceCharge/ram:Reason
  ubl: /Invoice/cac:InvoiceLine/cac:AllowanceCharge/cbc:AllowanceChargeReason
official_message:
  lang: en
  text: Each Invoice line allowance (BG-27) shall contain an Invoice line allowance reason (BT-139) or an Invoice line allowance reason code (BT-140), or both.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-23
title:
  fr: Une remise sur ligne n'a pas de motif
  en: A line allowance has no reason
brief:
  fr: 'Chaque remise sur ligne doit indiquer son motif : en texte, en code, ou les deux.'
  en: 'Each allowance on an invoice line must give its reason: as text, as a code, or both.'
search:
  en:
  - BR-CO-23
  - allowance on an invoice line reason missing
  - BG-27 BT-139 BT-140
  - AllowanceChargeReason
  fr:
  - BR-CO-23
  - remise sur ligne sans motif facture électronique
  - BT-139 BT-140
  - erreur BR-CO-23 factur-x
examples:
  source: invoice-examples
  version: 0.3.0
  target: fr
  valid: examples/fr/fixed/BR-CO-23.xml
  invalid: examples/fr/invalid/BR-CO-23.xml
related:
- BR-CO-24
- BR-42
- BR-CO-21
updated: '2026-11-17'
