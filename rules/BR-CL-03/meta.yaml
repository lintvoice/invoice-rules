id: BR-CL-03
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-110
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:TaxTotalAmount/@currencyID
  ubl: /Invoice//cbc:*[@currencyID]/@currencyID
official_message:
  lang: en
  text: currencyID MUST be coded using ISO code list 4217 alpha-3
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CL-03
title:
  en: An amount's currency is not a valid code
  fr: La devise d'un montant n'est pas un code valide
brief:
  en: The currency written next to an amount must be a three-letter ISO 4217 code, such as EUR.
  fr: La devise écrite à côté d'un montant doit être un code ISO 4217 à trois lettres, comme EUR.
search:
  en:
  - BR-CL-03
  - currencyID not valid ISO 4217
  - currencyID
  - error BR-CL-03
  fr:
  - BR-CL-03
  - currencyID devise invalide
  - currencyID ISO 4217
  - erreur BR-CL-03 factur-x
examples:
  source: invoice-examples
  version: 0.8.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-CL-04.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CL-04.xml
topic: totals
related:
- BR-CL-04
- BR-CL-05
- BR-05
updated: '2026-11-23'
