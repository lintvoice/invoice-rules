id: BR-CO-16
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-115
- BT-112
- BT-113
- BT-114
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:DuePayableAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:PayableAmount
official_message:
  lang: en
  text: Amount due for payment (BT-115) = Invoice total amount with VAT (BT-112) -Paid amount (BT-113) +Rounding amount (BT-114).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-16
title:
  en: The amount due is not the total with VAT minus what is paid plus rounding
  fr: Le net à payer n'est pas le total TTC, moins ce qui est payé, plus l'arrondi
brief:
  en: The amount due must be exactly the total with VAT, minus the amount already paid, plus any rounding.
  fr: Le net à payer doit être exactement le total TTC, moins le montant déjà payé, plus l'éventuel arrondi.
search:
  en:
  - BR-CO-16
  - amount due for payment mismatch
  - BT-115 BT-112 BT-113 BT-114
  - DuePayableAmount
  - PayableAmount
  fr:
  - BR-CO-16
  - net à payer incohérent facture électronique
  - BT-115
  - erreur BR-CO-16 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-CO-16.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-CO-16.xml
topic: totals
related:
- BR-CO-15
updated: '2026-11-16'
