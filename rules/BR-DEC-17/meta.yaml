id: BR-DEC-17
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-114
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:RoundingAmount
  ubl: /Invoice/cac:LegalMonetaryTotal/cbc:PayableRoundingAmount
official_message:
  lang: en
  text: The allowed maximum number of decimals for the Rounding amount (BT-114) is 2.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-DEC-17
title:
  en: The rounding amount has more than 2 decimals
  fr: L'arrondi a plus de 2 décimales
brief:
  en: The rounding amount must be written with at most 2 decimals, rounded to the cent.
  fr: L'arrondi doit être écrit avec au plus 2 décimales, arrondi au centime.
search:
  en:
  - BR-DEC-17
  - the rounding amount more than 2 decimals
  - BT-114
  - RoundingAmount decimals
  fr:
  - BR-DEC-17
  - l'arrondi plus de 2 décimales
  - BT-114
  - erreur BR-DEC-17 factur-x
examples:
  source: invoice-examples
  version: 0.7.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-DEC-17.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-FR-DEC-01-BT-114.xml
topic: totals
related:
- BR-DEC-18
- BR-CO-16
- BR-FR-DEC-01
updated: '2026-11-23'
