id: BR-CO-18
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-116
- BT-117
- BT-118
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:ApplicableTradeTax
  ubl: /Invoice/cac:TaxTotal/cac:TaxSubtotal
official_message:
  lang: en
  text: An Invoice shall at least have one VAT breakdown group (BG-23).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-CO-18
title:
  fr: La facture n'a pas de ventilation de TVA
  en: The invoice has no VAT breakdown
brief:
  fr: Toute facture doit détailler sa TVA par catégorie et par taux, même quand la TVA est nulle.
  en: Every invoice must break down its VAT by category and rate, even when the VAT is zero.
search:
  en:
  - BR-CO-18
  - VAT breakdown missing
  - BG-23
  - ApplicableTradeTax TaxSubtotal
  fr:
  - BR-CO-18
  - ventilation de TVA manquante facture électronique
  - BG-23
  - erreur BR-CO-18 factur-x
examples:
  source: invoice-examples
  version: 0.3.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: null
related:
- BR-CO-14
- BR-CO-04
updated: '2026-11-17'
