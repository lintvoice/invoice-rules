id: BR-B-02
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category B, Italy's split payment (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA B, paiement scindé italien (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-151
- BT-95
- BT-102
- BT-118
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeSettlement/ram:ApplicableTradeTax/ram:CategoryCode
  ubl: /Invoice/cac:InvoiceLine/cac:Item/cac:ClassifiedTaxCategory/cbc:ID
official_message:
  lang: en
  text: An Invoice that contains an Invoice line (BG-25), a Document level allowance (BG-20) or a Document level charge (BG-21) where the VAT category code (BT-151, BT-95 or BT-102) is “Split payment" shall
    not contain an invoice line (BG-25), a Document level allowance (BG-20) or a Document level charge (BG-21) where the VAT category code (BT-151, BT-95 or BT-102) is “Standard rated”.
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-B-02
title:
  en: Split payment and the standard rate on one invoice
  fr: Paiement scindé et taux normal sur une même facture
brief:
  en: An invoice that uses the VAT category B, Italy's split payment, does not also use the standard rate, S.
  fr: Une facture qui utilise la catégorie de TVA B, le paiement scindé italien, n'utilise pas aussi le taux normal, S.
search:
  en:
  - BR-B-02
  - split payment and standard rate
  - VAT category B S same invoice
  - BT-151 BT-118
  fr:
  - BR-B-02
  - paiement scindé et taux normal
  - catégorie de TVA B et S
  - erreur BR-B-02 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/valid.xml
      invalid: examples/en16931/invalid/BR-B-02.xml
    fr:
      valid: examples/fr/valid.xml
      invalid: examples/fr/invalid/BR-B-02.xml
topic: vat
related:
- BR-B-01
- BR-S-01
- BR-CL-18
updated: '2026-11-24'
