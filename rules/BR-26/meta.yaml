id: BR-26
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931, the European standard (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931, la norme européenne (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-146
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeAgreement/ram:NetPriceProductTradePrice/ram:ChargeAmount
  ubl: /Invoice/cac:InvoiceLine/cac:Price/cbc:PriceAmount
official_message:
  lang: en
  text: Each Invoice line (BG-25) shall contain the Item net price (BT-146).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-26
title:
  fr: Une ligne n'a pas de prix unitaire net
  en: A line has no net unit price
brief:
  fr: Chaque ligne doit indiquer son prix unitaire net ; pour un forfait de quantité 1, c'est le montant de la ligne.
  en: Each line must give its net unit price; for a flat fee of quantity 1, it is the line's amount.
search:
  en:
  - BR-26
  - item net price missing
  - BT-146
  - NetPriceProductTradePrice PriceAmount
  fr:
  - BR-26
  - prix unitaire net manquant facture électronique
  - BT-146
  - erreur BR-26 factur-x
examples:
  source: invoice-examples
  version: 0.4.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: null
topic: lines
related:
- BR-27
- BR-22
updated: '2026-11-18'
