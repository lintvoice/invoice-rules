id: BR-S-04
rule_set:
  name: EN 16931 validation artefacts (ConnectingEurope)
  version: 1.3.17
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
  licence: EUPL-1.2
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against EN 16931 that uses the VAT category S, standard rate (Factur-X from BASIC, XRechnung, Peppol BIS, French and German reform invoices).
    fr: Toute facture vérifiée selon EN 16931 qui utilise la catégorie de TVA S, taux normal (Factur-X à partir de BASIC, XRechnung, Peppol BIS, factures de la réforme française et allemande).
business_terms:
- BT-31
- BT-32
- BT-63
- BT-102
paths:
  cii: /rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeAgreement/ram:SellerTradeParty/ram:SpecifiedTaxRegistration/ram:ID
  ubl: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyTaxScheme/cbc:CompanyID
official_message:
  lang: en
  text: An Invoice that contains a Document level charge (BG-21) where the Document level charge VAT category code (BT-102) is "Standard rated" shall contain the Seller VAT Identifier (BT-31), the Seller
    tax registration identifier (BT-32) and/or the Seller tax representative VAT identifier (BT-63).
  source: https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/tag/validation-1.3.17
reported_ids:
- BR-S-04
title:
  en: A standard-rated charge requires the seller's VAT number
  fr: Des frais au taux normal exigent le numéro de TVA du vendeur
brief:
  en: An invoice with a charge on the whole invoice in the VAT category S (standard rate) must give the seller's VAT number, or its tax representative's.
  fr: Une facture qui a des frais globaux de la catégorie de TVA S (taux normal) doit indiquer le numéro de TVA du vendeur, ou celui de son représentant fiscal.
search:
  en:
  - BR-S-04
  - VAT category S VAT identifier
  - BT-31 seller VAT number
  - Standard rated document level charge
  fr:
  - BR-S-04
  - numéro de TVA catégorie S facture électronique
  - BT-31
  - erreur BR-S-04 factur-x
examples:
  source: invoice-examples
  version: 0.9.0
  targets:
    en16931:
      valid: examples/en16931/fixed/BR-S-04.xml
      invalid: examples/en16931/invalid/BR-S-04.xml
    fr:
      valid: examples/fr/fixed/BR-S-04.xml
      invalid: examples/fr/invalid/BR-S-04.xml
topic: vat
related:
- BR-S-02
- BR-S-03
- BR-CO-26
updated: '2026-11-27'
