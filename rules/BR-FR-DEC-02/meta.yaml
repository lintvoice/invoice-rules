id: BR-FR-DEC-02
rule_set:
  name: BR-FR (France_RFE, FNFE-MPE)
  version: 1.4.0.04
  source: https://github.com/fnfempe/France_RFE/tree/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d
  licence: Apache-2.0 (repository); EUPL (Schematron headers)
severity: fatal
applies_to:
  syntaxes:
  - CII
  - UBL
  when:
    en: Every invoice checked against the French reform rules (BR-FR), whatever the profile except Factur-X MINIMUM.
    fr: Toute facture vérifiée selon les règles de la réforme française (BR-FR), quel que soit le profil sauf Factur-X MINIMUM.
business_terms:
- BT-129
- BT-149
paths:
  cii: rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:IncludedSupplyChainTradeLineItem/ram:SpecifiedLineTradeDelivery/ram:BilledQuantity
  ubl: ubl:Invoice/cac:InvoiceLine/cbc:InvoicedQuantity | cn:CreditNote/cac:CreditNoteLine/cbc:CreditedQuantity
official_message:
  lang: fr
  text: 'La quantité « […] » est invalide. Elle doit : - être un nombre avec au plus 4 décimales (séparateur « . »), - contenir au maximum 19 caractères (hors séparateur), - et peut commencer par un signe
    « - ».'
  source: https://github.com/fnfempe/France_RFE/blob/97ba0f3d4ef2abed5780e9490d5c3a2be832ab1d/FNFE_RFE_INVOICE/CII/EN16931/schematron/BR-FR-Flux2-Schematron-CII.sch
reported_ids:
- BR-FR-DEC-02_BT-129
- BR-FR-DEC-02_BT-149
title:
  en: A quantity has more than 4 decimals
  fr: Une quantité a plus de 4 décimales
brief:
  en: Each quantity must be written with at most 4 decimals, a dot as separator, and at most 19 digits.
  fr: Chaque quantité doit être écrite avec au plus 4 décimales, un point comme séparateur, et 19 chiffres au plus.
search:
  en:
  - BR-FR-DEC-02
  - quantity more than 4 decimals invoice
  fr:
  - BR-FR-DEC-02
  - quantité plus de 4 décimales
  - format quantité facture
  - erreur BR-FR-DEC-02
examples:
  source: invoice-examples
  version: 0.1.0
  target: fr
  valid: examples/fr/valid.xml
  invalid: examples/fr/invalid/BR-FR-DEC-02.xml
related:
- BR-FR-DEC-01
- BR-FR-DEC-03
- BR-FR-DEC-04
updated: '2026-11-16'
